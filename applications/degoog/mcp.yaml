# degoog's MCP sidecar as a standalone Deployment (upstream ships it as a
# docker-compose sidecar - docker-compose-examples/mcp.yml - but standalone is
# cleaner here: degoog's own Deployment is Recreate-strategy for its RWO Longhorn
# PVC, so a sidecar would be needlessly bounced on every degoog image update,
# and the two don't share state). Reaches the aggregator via the same-namespace
# Service, same as the compose example's shared network.
#
# Endpoint: /mcp on port 4443 (streamable HTTP). LAN-only exposure via
# mcp-httproute.yaml (search-mcp.jvos.dev) - deliberately NOT published to
# public DNS, and no oauth2-proxy in front (see that file's comment for the
# trade-off).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: degoog-mcp
  namespace: degoog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: degoog-mcp
  template:
    metadata:
      labels:
        app: degoog-mcp
    spec:
      # Same collision class as degoog.yaml: the Service below is named
      # "degoog-mcp", so Kubernetes auto-injects DEGOOG_MCP_PORT=tcp://
      # <clusterIP>:4443 (legacy service-links), which degoog-mcp reads as
      # its listen address - "listen tcp: address :tcp://...: too many
      # colons in address" crash loop. Disable service-links and set the
      # port explicitly, exactly like the main deployment does for
      # DEGOOG_PORT.
      enableServiceLinks: false
      containers:
        - name: degoog-mcp
          image: ghcr.io/degoog-org/mcp:latest
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: DEGOOG_MCP_PORT
              value: "4443"
            - name: DEGOOG_MCP_DEGOOG_URL
              value: http://degoog:4444
            # Optional tuning (see upstream mcp.yml for what each does):
            # DEGOOG_MCP_MAX_RESULTS, DEGOOG_MCP_SEARCH_TEXT,
            # DEGOOG_MCP_ENGINES. DEGOOG_MCP_DEGOOG_API_KEY is only needed if
            # degoog's own API-key protection is enabled - it isn't on this
            # instance (no such env on the degoog Deployment).
          ports:
            - containerPort: 4443
          # tcpSocket, not httpGet: /mcp is a streamable-HTTP MCP endpoint,
          # not a plain web page - a GET probe would get 405, not 200.
          readinessProbe:
            tcpSocket:
              port: 4443
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 4443
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: degoog-mcp
  namespace: degoog
spec:
  selector:
    app: degoog-mcp
  ports:
    - port: 4443
      targetPort: 4443
