# Reference copy only, documenting the expected shape — not wired into
# kustomization.yaml's resources: list, so ArgoCD never applies it. Same
# convention as applications/paperless/secret.yaml: the real Secret is
# created directly on the cluster via kubectl, not committed. See repo
# CLAUDE.md: run kubectl over SSH on the node, not here.
#
# DEGOOG_SETTINGS_PASSWORDS gates degoog's own settings/extension-install UI
# (comma-separated list of passwords, read only from env — no on-disk file,
# no settings-UI way to set it). Doubly important here since
# DEGOOG_PUBLIC_INSTANCE is also set (degoog.yaml) — this is the credential
# that actually locks down installing extensions/engines on an
# internet-exposed instance, on top of the oauth2-proxy/Authelia login gate
# in front of the whole app (httproute.yaml).
#
#   kubectl create secret generic degoog-secrets \
#     --namespace degoog \
#     --from-literal=DEGOOG_SETTINGS_PASSWORDS="$(openssl rand -hex 16)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: degoog-secrets
  namespace: degoog
type: Opaque
