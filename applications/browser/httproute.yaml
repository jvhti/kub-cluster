# Public hostname for the human noVNC viewer + takeover UI (browser.jvos.dev).
#
# ONLY the viewer paths are published, and only through the browser-dedicated
# oauth2-proxy instance (Authelia OIDC login gate) — same one-instance-per-
# hostname pattern as memos/longhorn/degoog (see docs/oauth2-proxy-authelia.md).
# The manager's /v1/* agent API, /health, and /metrics are deliberately NOT
# matched by any rule here, so they are unreachable from the public gateway:
# a request to browser.jvos.dev/v1/... hits no route and 404s at the gateway
# before it ever reaches the manager. jvclaw reaches /v1/* in-cluster over the
# browser-manager Service DNS name instead.
#
# The three PathPrefix rules:
#   /viewer  -> the viewer HTML page (/viewer/), the takeover UI, and the RFB
#               WebSocket the noVNC client opens (/viewer/ws?session=...).
#   /novnc   -> the noVNC ES modules served statically by the manager
#               (/novnc/core/..., /novnc/app/...).
#   /oauth2  -> the proxy's own login flow endpoints (/oauth2/start,
#               /oauth2/callback, /oauth2/sign_in, ...). Without this the
#               sign-in 302 lands on an unrouted path and the gateway 404s
#               ("page can't be found") before Authelia is ever involved.
# All three go to oauth2-proxy-browser, which authenticates (Authelia) and
# proxies /viewer + /novnc to the manager; the manager then WS-proxies to
# the session pod's noVNC. /v1/*, /health, /metrics stay unrouted -> 404 at
# the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser
  namespace: browser
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "browser.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /viewer
        - path:
            type: PathPrefix
            value: /novnc
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        # Cross-namespace backendRef -> needs the ReferenceGrant in
        # infrastructure/controllers/oauth2-proxy-browser/reference-grant.yaml.
        - name: oauth2-proxy-browser
          namespace: oauth2-proxy-browser
          port: 80
          weight: 1
