# Reference only — real values are created imperatively (never committed), per
# this cluster's convention (see CLAUDE.md's secrets table).
---
# Bearer token for the manager's /v1/* agent API (src/config.ts reads it as
# API_TOKEN). jvclaw's browser tools send it as `Authorization: Bearer <token>`
# on every call, so the SAME value must be set in jvclaw's config when the
# browser tools are wired (Phase 3) — the two are the two halves of one
# credential and must be rotated together.
#
#   kubectl create secret generic browser-manager \
#     --namespace browser \
#     --from-literal=api-token="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: browser-manager
  namespace: browser
type: Opaque
---
# Lets k3s pull gitea.jvos.dev/jvhti/browser-manager. The repo is public, but
# the registry 401s anonymous pulls, so a pull secret is still required (same
# admin PAT as jvclaw's copy — see applications/jvclaw/secrets.yaml).
#
#   ADMIN_TOKEN=<the gitea-admin-pat Secret's value>
#   kubectl create secret docker-registry gitea-registry-pull \
#     --namespace browser \
#     --docker-server=gitea.jvos.dev \
#     --docker-username=jvhti \
#     --docker-password="$ADMIN_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry-pull
  namespace: browser
type: kubernetes.io/dockerconfigjson
