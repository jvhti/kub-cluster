apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: memos
  namespace: memos
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "memos.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Routes through the memos-dedicated oauth2-proxy instance instead
        # of straight to the memos Service — same Authelia-backed login gate
        # as Longhorn/degoog. A SEPARATE oauth2-proxy instance, not a shared
        # one — see infrastructure/controllers/oauth2-proxy-degoog/values.yaml
        # (and docs/oauth2-proxy-authelia.md) for why one shared instance
        # can't front two different hostnames. Needs the ReferenceGrant in
        # that same directory (cross-namespace backendRef).
        - name: oauth2-proxy-memos
          namespace: oauth2-proxy-memos
          port: 80
          weight: 1
