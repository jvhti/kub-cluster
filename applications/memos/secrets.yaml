apiVersion: v1
kind: Secret
metadata:
  name: memogram-bot-token
  namespace: memos
type: Opaque
# Real value created imperatively (never committed) — Telegram bot token
# from @BotFather, used by memogram.yaml's BOT_TOKEN env var.
#
#   kubectl create secret generic memogram-bot-token \
#     --namespace memos \
#     --from-literal=token='<bot token from @BotFather>' \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry-pull
  namespace: memos
type: kubernetes.io/dockerconfigjson
# Real value created imperatively (never committed) — lets k3s pull
# gitea.jvos.dev/jvhti/memogram, a private registry image (the
# memogram-build repo it's pushed from is private). Same admin PAT as
# gitea-admin-pat (default ns) — see CLAUDE.md's secrets table.
#
#   ADMIN_TOKEN=<the gitea-admin-pat Secret's value>
#   kubectl create secret docker-registry gitea-registry-pull \
#     --namespace memos \
#     --docker-server=gitea.jvos.dev \
#     --docker-username=jvhti \
#     --docker-password="$ADMIN_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
