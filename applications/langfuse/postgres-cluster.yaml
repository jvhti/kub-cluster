# Langfuse's Postgres — CNPG, same pattern as memos/degoog/immich.
# Single instance, no HA. Langfuse connects as user `langfuse` to db
# `langfuse` via the auto-created langfuse-postgres-app Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  instances: 1
  # Sustained CPU/IO consumer. Prefer the worker node (kub-node-1) over
  # the control plane, whose host (ra) saturates/thermal-throttles under
  # combined k3s + workload CPU pressure.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - kub-node-1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-bookworm
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse
  enablePDB: false
