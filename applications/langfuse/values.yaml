# Langfuse Helm chart values — all external deps pointed at shared
# infrastructure (CNPG Postgres, shared ClickHouse, Valkey, Garage S3).
# Chart: langfuse/langfuse v2.0.0 (v4 baseline).
#
# NOTE on structure: chart v2.0.0 reads Postgres from the TOP-LEVEL `postgresql:`
# key and auth/nextauth/feature flags from the `langfuse:` block. The old flat
# `postgres:` / `auth:` keys (community-chart shape) were IGNORED by v2.0.0 —
# which is why the chart silently deployed its bundled single-instance Postgres
# (langfuse-postgresql) and auto-generated churning salt/encryption/nextauth
# instead of using the CNPG cluster and the pinned secrets below. As of 2026-09-04
# this file uses the correct v2.0.0 shape: `postgresql:` points at the CNPG
# cluster (data migrated from the bundled instance) and salt/encryptionKey/
# nextauth.secret are pinned to langfuse-secrets so ArgoCD syncs never rotate
# them (rotating salt invalidates every API key; rotating encryptionKey makes
# encrypted columns unreadable).
langfuse:
  # Canonical public URL — required for SSO/OIDC. NextAuth builds the callback
  # URL ({NEXTAUTH_URL}/api/auth/callback/custom) and validates redirects from
  # it. Previously unset -> the chart defaulted to http://localhost:3000 and
  # SSO could not work.
  nextauth:
    url: https://langfuse.jvos.dev
    # Pinned (not chart-generated) so ArgoCD syncs never rotate it — rotating it
    # invalidates every active NextAuth session.
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauth-secret
  # Pinned (not chart-generated): rotating SALT re-hashes and invalidates every
  # API key; rotating ENCRYPTION_KEY makes already-encrypted columns unreadable.
  # Both live in langfuse-secrets (see secrets.yaml).
  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryption-key
  features:
    # Disable public sign-up / account creation. Users authenticate via the
    # Authelia OIDC provider below; existing email/password accounts still work.
    signUpDisabled: true
  auth:
    # Langfuse is its own OIDC client (Auth.js "custom" provider) authenticating
    # straight against Authelia — same pattern as Homarr / Open WebUI / Gatus /
    # ExcaliDash (see docs/oauth2-proxy-authelia.md for the client-secret pair
    # procedure). Each option becomes AUTH_CUSTOM_<OPTION> (snake->UPPER);
    # scalars are bare strings, the secret uses secretKeyRef. Plaintext half
    # lives in langfuse-secrets (oidc-client-secret); hashed half lives in
    # authelia-oidc-client-langfuse (see infra authelia values + secrets below).
    providers:
      custom:
        clientId: langfuse
        clientSecret:
          secretKeyRef:
            name: langfuse-secrets
            key: oidc-client-secret
        issuer: https://auth.jvos.dev
        name: Authelia
web:
  deploy: true

worker:
  deploy: true

ingress:
  enabled: false

# Postgres — the CNPG cluster (langfuse-postgres), NOT the chart's bundled
# single-instance. deploy:false stops the bundled subchart (which used to be
# silently deployed because the flat `postgres:` key was ignored); host points at
# the CNPG read-write service. langfuse connects as user `langfuse` (password from
# the CNPG-managed langfuse-postgres-app Secret, which does NOT churn). Existing
# data (68 tables / 14MB) was migrated bundled -> CNPG on 2026-09-04.
postgresql:
  deploy: false
  host: langfuse-postgres-rw
  port: 5432
  auth:
    username: langfuse
    existingSecret: langfuse-postgres-app
    secretKeys:
      userPasswordKey: password
    database: langfuse

clickhouse:
  deploy: false
  host: clickhouse.clickhouse
  httpPort: 8123
  nativePort: 9000
  database: default
  crdCheck: false
  cluster:
    enabled: false
  auth:
    username: default
    existingSecret: clickhouse-credentials
    existingSecretKey: password

redis:
  deploy: false
  host: langfuse-redis
  port: 6379
  auth:
    username: default
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redis-password

s3:
  deploy: false
  bucket: langfuse
  region: garage
  endpoint: http://garage.garage:3900
  forcePathStyle: true
  auth:
    existingSecret: langfuse-secrets
    secretKeys:
      accessKeyIdKey: garage-access-key-id
      secretAccessKeyKey: garage-secret-access-key
  batchExport:
    enabled: false

# (The old flat `auth:` block that pointed salt/encryption-key/nextauth-secret at
# langfuse-secrets was ignored by v2.0.0. Those are now pinned via
# langfuse.salt / langfuse.encryptionKey / langfuse.nextauth.secret above.)
