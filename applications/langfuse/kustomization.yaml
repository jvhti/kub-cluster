apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: langfuse

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - valkey.yaml
  - httproute.yaml
  # - secrets.yaml  # Real values created imperatively — see that file's comments.

helmCharts:
  - name: langfuse
    repo: https://langfuse.github.io/langfuse-k8s
    version: 2.0.0
    releaseName: langfuse
    namespace: langfuse
    valuesFile: values.yaml
    includeCRDs: false
