# langfuse-secrets (ns langfuse) — all of Langfuse's auth/crypto material
# plus its Garage S3 credentials. Created imperatively, never committed.
#
# Generate:
#   SALT=$(openssl rand -base64 32)
#   ENCRYPTION_KEY=$(openssl rand -hex 32)
#   NEXTAUTH_SECRET=$(openssl rand -base64 32)
#   REDIS_PASSWORD=$(openssl rand -hex 32)
#   GARAGE_AK=<same value as garage-s3's GARAGE_DEFAULT_ACCESS_KEY>
#   GARAGE_SK=<same value as garage-s3's GARAGE_DEFAULT_SECRET_KEY>
#
#   kubectl create secret generic langfuse-secrets -n langfuse \
#     --from-literal=salt="$SALT" \
#     --from-literal=encryption-key="$ENCRYPTION_KEY" \
#     --from-literal=nextauth-secret="$NEXTAUTH_SECRET" \
#     --from-literal=redis-password="$REDIS_PASSWORD" \
#     --from-literal=garage-access-key-id="$GARAGE_AK" \
#     --from-literal=garage-secret-access-key="$GARAGE_SK" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Note: garage-access-key-id / garage-secret-access-key must match the
# garage-s3 secret in ns garage (GARAGE_DEFAULT_ACCESS_KEY /
# GARAGE_DEFAULT_SECRET_KEY) — they're the same credentials, just stored
# in two namespaces because each pod set reads from its own ns.
#
# --- oidc-client-secret (Authelia SSO) ---
#
# langfuse-secrets ALSO carries `oidc-client-secret` — the PLAINTEXT half of
# the Authelia OIDC client pair (Langfuse's AUTH_CUSTOM_CLIENT_SECRET, see
# values.yaml's langfuse.auth.providers.custom). It was added to the existing
# Secret via a JSON patch, not the `create secret` command above (which
# predates SSO):
#
#   kubectl patch secret langfuse-secrets -n langfuse --type=json \
#     -p='[{"op":"add","path":"/data/oidc-client-secret","value":"<base64 of the plaintext>"}]'
#
# The HASHED half is authelia-oidc-client-langfuse (ns authelia), documented
# as the reference Secret at the bottom of this file — same pattern as the
# Homarr / Open WebUI / Gatus / ExcaliDash own-client pairs (those live in
# their app's secrets.yaml, not in infrastructure/controllers/authelia/
# secrets.yaml, which only holds the oauth2-proxy-instance clients). Same
# plaintext, pbkdf2-hashed. Regenerate both together using
# docs/oauth2-proxy-authelia.md's "Generating a client-secret pair" procedure
# (validate the pair before applying; never pass --random alongside
# --password).
#
#   (continuing from the CLIENT_SECRET/HASH vars generated in that runbook)
#   kubectl create secret generic authelia-oidc-client-langfuse \
#     --namespace authelia \
#     --from-literal=client-secret-hash="$HASH" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-client-langfuse
  namespace: authelia
type: Opaque
