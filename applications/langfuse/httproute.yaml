apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: langfuse
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "langfuse.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Same-namespace backendRef (langfuse-web Service is created by the
        # Helm chart in ns langfuse) — no ReferenceGrant needed.
        - name: langfuse-web
          port: 3000
          weight: 1
