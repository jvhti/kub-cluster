# Single standalone Deployment running paperless-ngx's all-in-one image
# (webserver + consumer + scheduler + Huey task worker together) — no
# split into separate webserver/worker Deployments, matching this repo's
# preference for the simplest shape that works at homelab scale (see
# kavita.yaml, jellyfin, etc. — one Deployment per logical app unless
# something forces a split).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO Longhorn data PVC (search index) — a RollingUpdate would try to attach it to two pods at once
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      # Kubernetes auto-injects a <SVCNAME>_PORT env var for every Service
      # visible to the pod, using the legacy Docker-links convention — and
      # since the Service here is also named "paperless", that becomes
      # PAPERLESS_PORT=tcp://<clusterIP>:8000. paperless-ngx's own granian
      # startup script reads PAPERLESS_PORT directly as its --port flag,
      # so the two collided and granian refused to start ("not a valid
      # integer"). Confirmed live. Disabling service-links avoids this
      # whole class of collision for any other PAPERLESS_* var a future
      # same-named Service might introduce, on top of the explicit
      # PAPERLESS_PORT override below.
      enableServiceLinks: false
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:2.15
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_URL
              value: https://paperless.jvos.dev
            - name: PAPERLESS_TIME_ZONE
              value: America/Sao_Paulo
            - name: PAPERLESS_DBHOST
              value: paperless-postgres-rw
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-app
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-app
                  key: password
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_ADMIN_USER
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_ADMIN_PASSWORD
            - name: PAPERLESS_CONSUMER_RECURSIVE
              value: "true"
            - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
              value: "true"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
          # Generous startup allowance: the entrypoint runs the full Django
          # migration history (every paperless-ngx release back to its
          # first) before the web server binds to :8000 at all. Confirmed
          # live: a from-scratch DB took several minutes of migrations
          # alone, well past a 60s liveness initialDelaySeconds — that
          # killed the container mid-migration and looped it forever. A
          # startupProbe (generous failureThreshold, not counted against
          # liveness until it passes once) is the right tool here rather
          # than just stretching liveness's own delay.
          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
    - port: 8000
      targetPort: 8000
