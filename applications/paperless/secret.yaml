# Reference copy only, documenting the expected shape — not wired into
# kustomization.yaml's resources: list, so ArgoCD never applies it. Same
# convention as applications/arr-stack/jellystat-secret.yaml: the real
# Secret is created directly on the cluster via kubectl, not committed.
# PAPERLESS_SECRET_KEY signs sessions/cookies — any random string is fine;
# rotating it just invalidates existing sessions, not any actual data.
# See repo CLAUDE.md: run kubectl over SSH on the node, not here.
#
# kubectl create secret generic paperless-secrets \
#   --namespace paperless \
#   --from-literal=PAPERLESS_SECRET_KEY="$(openssl rand -hex 32)" \
#   --from-literal=PAPERLESS_ADMIN_USER=admin \
#   --from-literal=PAPERLESS_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: paperless-secrets
  namespace: paperless
type: Opaque
