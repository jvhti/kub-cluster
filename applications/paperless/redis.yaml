# paperless-ngx uses Redis as its task-queue broker (Huey), not just cache
# — same plain-Deployment-+-PVC pattern as applications/immich/redis.yaml,
# no persistence guarantees needed beyond surviving a pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      # Soft-preferred onto pi1: a tiny task-queue broker, no real CPU need,
      # and pi1 (arm64, 4 vCPU/8GB) has more spare headroom than the two k8s
      # VMs, which were found oversubscribed on host RAM (2026-09-03).
      # "preferred" not "required" so it still schedules fine if pi1 is ever
      # down. (The main paperless app itself stays unpinned — it does real
      # OCR/PDF CPU work, a poor fit for pi1's smaller cores.)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - pi1
      containers:
        - name: redis
          image: valkey/valkey:8.1.4
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  selector:
    app: paperless-redis
  ports:
    - port: 6379
      targetPort: 6379
