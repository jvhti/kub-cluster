# Garage secrets — all created imperatively, never committed.
#
# 1. garage-config (ns garage) — the garage.toml file itself.
#    Contains rpc_secret (hex-32) and admin/metrics tokens (base64-32).
#    Generate:
#      RPC_SECRET=$(openssl rand -hex 32)
#      ADMIN_TOKEN=$(openssl rand -base64 32)
#      METRICS_TOKEN=$(openssl rand -base64 32)
#    Then create the toml:
#      TOML='metadata_dir="/data/meta"
#      data_dir="/data/data"
#      db_engine="sqlite"
#      replication_factor=1
#
#      rpc_bind_addr="[::]:3901"
#      rpc_public_addr="127.0.0.1:3901"
#      rpc_secret="$RPC_SECRET"
#
#      [s3_api]
#      s3_region="garage"
#      api_bind_addr="[::]:3900"
#      root_domain=".s3.garage.localhost"
#
#      [s3_web]
#      bind_addr="[::]:3902"
#      root_domain=".s3.garage.localhost"
#
#      [admin]
#      api_bind_addr="[::]:3903"
#      admin_token="$ADMIN_TOKEN"
#      metrics_token="$METRICS_TOKEN"'
#      kubectl create secret generic garage-config -n garage \
#        --from-literal=garage.toml="$TOML" \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# 2. garage-s3 (ns garage) — Langfuse's default bucket credentials.
#    --default-bucket auto-creates this key + "langfuse" bucket on first boot.
#    The same values are also stored in langfuse-secrets (ns langfuse) as
#    garage-access-key-id / garage-secret-access-key for Langfuse's S3 config.
#      ACCESS_KEY=$(openssl rand -hex 16)
#      SECRET_KEY=$(openssl rand -hex 32)
#      kubectl create secret generic garage-s3 -n garage \
#        --from-literal=GARAGE_DEFAULT_BUCKET=langfuse \
#        --from-literal=GARAGE_DEFAULT_ACCESS_KEY="$ACCESS_KEY" \
#        --from-literal=GARAGE_DEFAULT_SECRET_KEY="$SECRET_KEY" \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# 3. garage-public-s3-key (ns garage) — dedicated key for s3.jvos.dev,
#    scoped to the "general" bucket only. Created AFTER the garage pod is
#    Ready (needs the running admin API):
#      kubectl exec -n garage deploy/garage -- garage key create s3-public
#      kubectl exec -n garage deploy/garage -- garage bucket create general
#      kubectl exec -n garage deploy/garage -- garage bucket allow \
#        --read --write --owner general --key s3-public
#    Then store the resulting access/secret keys:
#      kubectl create secret generic garage-public-s3-key -n garage \
#        --from-literal=access-key-id='<ak>' \
#        --from-literal=secret-access-key='<sk>' \
#        --dry-run=client -o yaml | kubectl apply -f -
