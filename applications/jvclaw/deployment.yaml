# jvclawd — the headless jvclaw daemon (channels + agent loop + scheduler +
# HTTP API + Prometheus metrics, all on :7860). Built by the Gitea Actions
# pipeline in the `jvclaw` repo (see docs/gitea-actions.md) and pushed to
# gitea.jvos.dev/jvhti/jvclaw. Tag is the short git SHA of each build (never
# :latest); the build workflow's "Bump kub-cluster image tag" step rewrites
# the image ref below to the just-pushed SHA and pushes to Gitea origin after
# every successful build, then ArgoCD does the Recreate rollout.
#
# Single-replica by design: workspace/ holds a single-writer SQLite DB, so
# replicas:1 + a Recreate strategy (a RollingUpdate would try to attach the RWO
# Longhorn PVC to two pods at once — same reason as memos/memogram above).
#
# Config (main.json / models.json / channels.json / prompts/) ships baked into
# the jvclaw-customized image at /opt/jvclaw-workspace-seed and is copied onto
# the PVC by the seed-workspace initContainer on every start (the daemon
# hard-exits if main.json is missing — internal/agent/config.go LoadConfig).
# This repo's config/ dir is the source of truth for what gets baked in: it is
# copied into the jvclaw-customized repo's workspace/ and the image's seed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvclawd
  namespace: jvclaw
  labels:
    app: jvclawd
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO Longhorn workspace PVC — a RollingUpdate would attach it to two pods at once
  selector:
    matchLabels:
      app: jvclawd
  template:
    metadata:
      labels:
        app: jvclawd
    spec:
      # gitea.jvos.dev 401s anonymous pulls — k3s needs this docker-registry
      # Secret (same admin PAT as gitea-admin-pat). Created imperatively — see
      # secrets.yaml.
      imagePullSecrets:
        - name: gitea-registry-pull
      # The image is distroless nonroot (uid 65532) — fsGroup makes the
      # Longhorn PVC group-writable by that uid so the SQLite DB + runtime
      # agent/skill dirs are writable (same pattern as memogram.yaml).
      securityContext:
        fsGroup: 65532
      # Seed the workspace PVC on every start. The customized image bakes the
      # config + prompts at /opt/jvclaw-workspace-seed (jvclaw-customized repo);
      # this initContainer copies them onto the PVC each start, replacing the
      # old imperative one-time seeding. It runs as the image's non-root user
      # (65532) — it only writes to the fsGroup-owned volume, so no root needed.
      # The mkdir + `cp -a` only add/update the seed's config + prompts; the
      # data/agent/skills dirs (SQLite DB, runtime state) persist untouched.
      # No-op if the seed dir is absent (still on the plain jvclaw base image
      # before the first customized build).
      initContainers:
        - name: seed-workspace
          # Bumped in lockstep with the main container by the jvclaw-customized
          # workflow's "Bump kub-cluster image tag" step (its sed rewrites every
          # `jvclaw[-customized]:<sha>` ref in this file to the new tag).
          image: gitea.jvos.dev/jvhti/jvclaw:2e1ebc7
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /workspace/data /workspace/agent /workspace/skills
              if [ -d /opt/jvclaw-workspace-seed ]; then
                cp -a /opt/jvclaw-workspace-seed/. /workspace/
              fi
      containers:
        - name: jvclawd
          image: gitea.jvos.dev/jvhti/jvclaw:2e1ebc7
          ports:
            # The daemon binds ONE listener (d.listen, 0.0.0.0:7860) for /v1/*,
            # GET /metrics and the OpenAPI spec — same mux, no separate metrics
            # port (see jvclaw internal/daemon/daemon.go registerDaemonRoutes).
            # models.json's observability.metrics.listen "0.0.0.0:9090" is dead
            # config jvclawd never binds; :9090 is NOT a real port here.
            - name: http
              containerPort: 7860
          # TELEGRAM_BOT_TOKEN (referenced as "env:TELEGRAM_BOT_TOKEN" in
          # config/channels.json) + LANGFUSE_* (referenced by name in
          # config/models.json observability). Secret created imperatively —
          # see secrets.yaml.
          envFrom:
            - secretRef:
                name: jvclawd-secrets
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          # /v1/health returns ok unconditionally — liveness-only, but it
          # correctly catches a hung/crashed process for both probes.
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: jvclawd-workspace
