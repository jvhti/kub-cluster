# Reference only — real values are created imperatively (never committed), per
# this cluster's convention (see CLAUDE.md's secrets table).
---
# Env vars referenced by name in config/:
#   - TELEGRAM_BOT_TOKEN — channels.json telegram.token is "env:TELEGRAM_BOT_TOKEN"
#   - LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY — models.json observability.langfuse
# No LANGFUSE_EVAL_PUBLIC_KEY/SECRET_KEY: observability.eval was disabled in
# models.json (2026-09-10) after its key pair turned out to be dead ("No key
# found" in langfuse-web logs — likely a leftover from before the Postgres
# bundled->CNPG migration, applications/langfuse/values.yaml's comment) at
# the same time observability.langfuse's own key also needed regenerating;
# only the main langfuse key was recreated, eval wasn't re-enabled.
# No OPENAI_API_KEY: local-first, the openai provider in models.json is a
# fallback with no key set (its apiKeyEnv simply resolves to nothing).
#
#   kubectl create secret generic jvclawd-secrets \
#     --namespace jvclaw \
#     --from-literal=TELEGRAM_BOT_TOKEN='<bot token>' \
#     --from-literal=LANGFUSE_PUBLIC_KEY='<...>' \
#     --from-literal=LANGFUSE_SECRET_KEY='<...>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: jvclawd-secrets
  namespace: jvclaw
type: Opaque
---
# Lets k3s pull gitea.jvos.dev/jvhti/jvclaw (private registry image — the
# jvclaw repo it's pushed from is private). Same admin PAT as gitea-admin-pat
# (default ns) — see CLAUDE.md's secrets table, identical to memos' copy.
#
#   ADMIN_TOKEN=<the gitea-admin-pat Secret's value>
#   kubectl create secret docker-registry gitea-registry-pull \
#     --namespace jvclaw \
#     --docker-server=gitea.jvos.dev \
#     --docker-username=jvhti \
#     --docker-password="$ADMIN_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry-pull
  namespace: jvclaw
type: kubernetes.io/dockerconfigjson
