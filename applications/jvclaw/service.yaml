# jvclawd's HTTP API on :7860. The daemon binds ONE listener (d.listen) for
# /v1/*, GET /metrics and the OpenAPI spec — same mux, no separate metrics port
# (see jvclaw internal/daemon/daemon.go registerDaemonRoutes). No Ingress on
# purpose: Telegram is an outbound long-poll (the daemon connects out, nothing
# inbound on :7860), and the HTTP API is consumed via port-forward, not exposed
# publicly. See docs/deployment/kubernetes.md in the jvclaw repo.
apiVersion: v1
kind: Service
metadata:
  name: jvclawd
  namespace: jvclaw
  labels:
    app: jvclawd
spec:
  selector:
    app: jvclawd
  ports:
    - name: http
      port: 7860
      targetPort: 7860
