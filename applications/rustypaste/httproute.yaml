apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustypaste
  namespace: rustypaste
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "paste.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Same-namespace backend, so no ReferenceGrant is needed (unlike the
        # cross-namespace oauth2-proxy backendRefs in other apps here).
        - name: rustypaste
          namespace: rustypaste
          port: 8000
          weight: 1
