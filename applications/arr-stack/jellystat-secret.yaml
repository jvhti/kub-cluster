# Reference copy only, documenting the expected shape — not wired into
# kustomization.yaml's resources: list, so ArgoCD never applies it. Same
# convention as gluetun-secret.yaml: the real Secret is created directly
# on the cluster via kubectl, not committed. JWT_SECRET is jellystat's own
# session-signing key (any random string — TrueNAS's app generated one
# automatically; a fresh one is fine here since it only invalidates
# existing jellystat sessions/API tokens, not any actual data).
# See repo CLAUDE.md: run kubectl over SSH on the node, not here.
#
# kubectl create secret generic jellystat-secrets \
#   --namespace arr \
#   --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: jellystat-secrets
  namespace: arr
type: Opaque
