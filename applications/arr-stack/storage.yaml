    storage: 4Ti # nominal — NFS doesn't enforce this, ZFS quota (if any) is the real limit
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: arr-media
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.5
    path: /mnt/General/arr/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-media
  namespace: arr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: arr-media
  resources:
    requests:
      storage: 4Ti
  volumeName: arr-media
