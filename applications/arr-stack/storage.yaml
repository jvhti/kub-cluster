---
# jellystat's own backup-export directory (its in-app "create a backup"
# feature, not related to the Postgres data itself) — was an ix-volume on
# TrueNAS, not dataset-backed, so nothing to keep in place; a fresh
# Longhorn PVC is simplest, matching the "re-provision fresh" side of the
# storage-choice rule above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-jellystat-backup
  namespace: arr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
