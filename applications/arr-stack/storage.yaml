# Static PVs over the existing TrueNAS datasets that already held each
# app's config/data (General/arr/configs/<app>, General/arr/media) — same
# keep-data-in-place approach as applications/immich/storage.yaml. Each
# path is its own ZFS dataset, not a subdirectory of a parent dataset (see
# docs/truenas-app-migrations.md's "NFS exports: only child datasets" note
# for why that distinction matters).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-prowlarr-config
spec:
  capacity:
    storage: 10Gi # nominal — NFS doesn't enforce this
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: arr-prowlarr-config
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.5
    path: /mnt/General/arr/configs/prowlarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-prowlarr-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: arr-prowlarr-config
  resources:
    requests:
      storage: 10Gi
  volumeName: arr-prowlarr-config
---
