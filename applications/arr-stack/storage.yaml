# Static PVs over the existing TrueNAS datasets that already held each
# app's config/data (General/arr/configs/<app>, General/arr/media) — same
# keep-data-in-place approach as applications/immich/storage.yaml. Each
# path is its own ZFS dataset, not a subdirectory of a parent dataset (see
# docs/truenas-app-migrations.md's "NFS exports: only child datasets" note
# for why that distinction matters).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-prowlarr-config
spec:
  capacity:
    storage: 10Gi # nominal — NFS doesn't enforce this
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: arr-prowlarr-config
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.5
    path: /mnt/General/arr/configs/prowlarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-prowlarr-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: arr-prowlarr-config
  resources:
    requests:
      storage: 10Gi
  volumeName: arr-prowlarr-config
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-qbittorrent-config
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: arr-qbittorrent-config
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.5
    path: /mnt/General/arr/configs/qbittorrent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-qbittorrent-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: arr-qbittorrent-config
  resources:
    requests:
      storage: 10Gi
  volumeName: arr-qbittorrent-config
---
# sonarr/radarr/bazarr config on Longhorn (dynamically provisioned), not
# NFS — unlike prowlarr/qbittorrent's config or the media share, these
# apps hammer a local SQLite db in WAL mode, which needs real mmap +
# byte-range locking that NFS doesn't reliably provide. Confirmed live:
# within minutes of going live over NFS, radarr.db's header was zeroed
# out (unrecoverable — restored from its own most recent scheduled
# backup instead) and sonarr.db intermittently threw "disk I/O error"
# until its Deployment was scaled to 0 and the WAL got a chance to
# checkpoint cleanly. Longhorn gives each app real attached block
# storage, sidestepping the whole class of problem. ReadWriteOnce is
# fine — each Deployment runs a single replica already (Recreate
# strategy).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-sonarr-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-radarr-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-bazarr-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# jellyfin/jellyseerr config: bind-mounted, dataset-backed data on TrueNAS
# (General/arr/configs/jellyfin, General/arr/configs/jellyseerr) kept in
# place, same static-PV approach as prowlarr/qbittorrent above — these
# apps don't keep a WAL-mode SQLite db in /config (jellyfin uses its own
# non-WAL sqlite for library metadata, and confirmed fine on NFS in
# practice for this app; jellyseerr's config is just JSON/settings), so
# no Longhorn detour needed here.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-jellyfin-config
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: arr-jellyfin-config
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.5
    path: /mnt/General/arr/configs/jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-jellyfin-config
  namespace: arr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: arr-jellyfin-config
  resources:
    requests:
      storage: 10Gi
  volumeName: arr-jellyfin-config
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-jellyseerr-config
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
