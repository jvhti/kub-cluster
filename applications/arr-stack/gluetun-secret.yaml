# Reference copy only, documenting the expected shape — not wired into
# kustomization.yaml's resources: list, so ArgoCD never applies it. The
# real Secret was created directly on the cluster via kubectl, migrated
# from TrueNAS's gluetun app config (WIREGUARD_PRIVATE_KEY/
# WIREGUARD_PRESHARED_KEY/WIREGUARD_ADDRESSES, AirVPN WireGuard config).
# See repo CLAUDE.md: run kubectl over SSH on the node, not here.
#
# kubectl create secret generic gluetun-wireguard \
#   --namespace arr \
#   --from-literal=WIREGUARD_PRIVATE_KEY='...' \
#   --from-literal=WIREGUARD_PRESHARED_KEY='...' \
#   --from-literal=WIREGUARD_ADDRESSES='...' \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: gluetun-wireguard
  namespace: arr
type: Opaque
