apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # Matches uid/gid 568 (TrueNAS's "apps" user), which already owns the
      # existing upload data on the NFS share — avoids a chown of the whole
      # library on first mount.
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      # kub-node-1 (a KVM VM with an emulated HDD) is chronically CPU/disk
      # saturated, so immich-server crashlooped there for hours (couldn't
      # load node_modules inside the liveness window). Steer it off that node
      # to wherever has headroom (overkill today). Not pinned — overkill may
      # go down. /data is on NFS (TrueNAS), so no local state ties it to a node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kub-node-1
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.1.0
          ports:
            - containerPort: 2283
          env:
            - name: DB_HOSTNAME
              value: immich-postgres-rw
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: UPLOAD_LOCATION
              value: /data
            # fotos.jvos.dev is internet-reachable via the DMZ-forwarder
            # (gateway-internal) with no auth gate — don't let anonymous
            # visitors register accounts. Existing accounts still log in
            # normally; new users need an admin-created account.
            - name: IMMICH_DISABLE_SIGNUP
              value: "true"
            # No machine-learning service deployed yet — smart search/face
            # recognition stay off until that's added. The server itself
            # doesn't hard-require ML at boot; it's toggled in Admin Settings.
          volumeMounts:
            - name: uploads
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 20
          # kub-node-1 (a KVM VM with an emulated HDD) is chronically
          # CPU/disk-saturated, so booting the Node.js server (loading
          # node_modules = thousands of small reads) can exceed the old
          # ~90s liveness window and crashloop forever. A startupProbe lets
          # it take up to 5min to boot; once it answers, liveness/readiness
          # gate it as normal.
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: immich-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
      targetPort: 2283
