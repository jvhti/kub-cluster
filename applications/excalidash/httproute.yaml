apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidash
  namespace: excalidash
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "draw.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Frontend nginx only — it proxies /api/ and /socket.io/ (the
        # live-collab websocket upgrade) to excalidash-backend itself, so
        # the backend never needs to be routed to directly. No ReferenceGrant
        # needed since this doesn't cross namespaces.
        - name: excalidash-frontend
          port: 80
          weight: 1
