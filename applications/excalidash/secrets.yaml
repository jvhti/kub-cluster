# Real values created imperatively (never committed), same convention as
# every other app's secrets.yaml in this repo. Exact keys required by
# excalidash.yaml's secretKeyRefs below: jwt-secret, csrf-secret,
# oidc-client-secret.
#
# jwt-secret / csrf-secret — any long random strings; stable for the life
# of the deployment (rotating either invalidates every existing
# session/CSRF token).
#
# oidc-client-secret is the PLAINTEXT half of the credential pair also
# hashed into infrastructure/controllers/authelia/secrets.yaml's
# authelia-oidc-client-excalidash Secret — follow
# docs/oauth2-proxy-authelia.md's "Generating a client-secret pair"
# procedure exactly (same shape as Homarr/Gatus', just naming the client
# "excalidash" instead of an oauth2-proxy instance):
#
#   CLIENT_SECRET=$(openssl rand -hex 32)
#   HASH=$(kubectl exec -n authelia deploy/authelia -- \
#     authelia crypto hash generate pbkdf2 --password "$CLIENT_SECRET" \
#     2>&1 | grep -oP '(?<=Digest: ).*')
#   kubectl exec -n authelia deploy/authelia -- \
#     authelia crypto hash validate "$HASH" --password "$CLIENT_SECRET"
#   # must print exactly: "The password matches the digest."
#
#   kubectl create secret generic authelia-oidc-client-excalidash \
#     --namespace authelia \
#     --from-literal=client-secret-hash="$HASH" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic excalidash-secrets \
#     --namespace excalidash \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=csrf-secret="$(openssl rand -hex 32)" \
#     --from-literal=oidc-client-secret="$CLIENT_SECRET" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl rollout restart deployment/authelia -n authelia
apiVersion: v1
kind: Secret
metadata:
  name: excalidash-secrets
  namespace: excalidash
type: Opaque
