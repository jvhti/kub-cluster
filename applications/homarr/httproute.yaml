apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homarr
  namespace: homarr
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "start.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Straight to the homarr Service, unlike memos/degoog/longhorn —
        # Homarr has no "trust the reverse proxy" auth mode (only
        # Credentials/LDAP/OIDC), so it authenticates itself via its own
        # Authelia OIDC client (see homarr.yaml's AUTH_OIDC_* env vars)
        # instead of sitting behind a dedicated oauth2-proxy instance. No
        # ReferenceGrant needed since this doesn't cross namespaces.
        - name: homarr
          port: 7575
          weight: 1
