# Real values created imperatively (never committed), same convention as
# every other app's secrets.yaml in this repo. Exact keys required by
# homarr.yaml's secretKeyRefs below: secret-encryption-key, oidc-client-secret.
#
# secret-encryption-key encrypts secrets Homarr itself stores in its db
# (e.g. integration API keys added later via the UI) — generate once and
# never change it, or existing encrypted values become unreadable.
#
# oidc-client-secret is the PLAINTEXT half of the credential pair also
# hashed into infrastructure/controllers/authelia/secrets.yaml's
# authelia-oidc-client-homarr Secret — see docs/oauth2-proxy-authelia.md's
# "Generating a client-secret pair" section for the exact
# generate-then-validate procedure (same shape, just naming the client
# "homarr" instead of an oauth2-proxy instance).
#
#   kubectl create secret generic homarr-secrets \
#     --namespace homarr \
#     --from-literal=secret-encryption-key="$(openssl rand -hex 32)" \
#     --from-literal=oidc-client-secret='<the PLAINTEXT value — must match
#         the plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client-homarr Secret>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: homarr-secrets
  namespace: homarr
type: Opaque
