# Homarr (https://homarr.dev) — homepage dashboard linking out to every
# other app in this cluster. Single standalone Deployment, no gluetun
# netns needed — same shape as kavita/memos.
#
# Auth: Homarr has no "trust the reverse proxy" mode (only
# Credentials/LDAP/OIDC — confirmed against its own Single-Sign-On docs),
# so unlike memos/degoog/longhorn it does NOT sit behind a dedicated
# oauth2-proxy instance. Instead it's its own Authelia OIDC client (see
# infrastructure/controllers/authelia/values.yaml's "homarr" client entry),
# same credential-pair pattern documented in
# docs/oauth2-proxy-authelia.md, just terminating in Homarr itself instead
# of oauth2-proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO Longhorn data PVC — a RollingUpdate would try to attach it to two pods at once
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:v1.76.0
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: AUTH_PROVIDERS
              value: oidc
            - name: AUTH_OIDC_ISSUER
              value: https://auth.jvos.dev
            - name: AUTH_OIDC_CLIENT_ID
              value: homarr
            - name: AUTH_OIDC_CLIENT_NAME
              value: Authelia
            - name: AUTH_OIDC_SCOPE_OVERWRITE
              value: "openid profile email groups"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: secret-encryption-key
            # Required by Auth.js (NextAuth) itself to encrypt the OIDC
            # login flow's JWE-encrypted state/session cookies — separate
            # from SECRET_ENCRYPTION_KEY above (that one only encrypts
            # integration secrets Homarr stores in its own db). Missing
            # this was the actual root cause of a real
            # "?error=Configuration" / OAuthProfileParseError /
            # ERR_JWE_DECRYPTION_FAILED loop on first deploy — confirmed
            # against homarr-labs/homarr's own .env.example, which flags
            # AUTH_SECRET as required for Auth.js regardless of provider.
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: auth-secret
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: oidc-client-secret
          ports:
            - containerPort: 7575
          volumeMounts:
            - name: data
              mountPath: /appdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homarr-data
---
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: homarr
spec:
  selector:
    app: homarr
  ports:
    - port: 7575
      targetPort: 7575
