# Real values created imperatively (never committed), same convention as
# every other app's secrets.yaml in this repo.
#
# --- openwebui-secrets (openwebui.yaml) ---
#
# webui-secret-key is Open WebUI's own session/JWT signing secret — leaving
# it unset means a new random one is generated on every pod boot, silently
# invalidating all sessions on every restart (same class of bug Homarr hit
# with AUTH_SECRET — see applications/homarr/secrets.yaml). Generate once,
# never rotate casually.
#
# oidc-client-secret is the PLAINTEXT half of the credential pair also
# hashed into infrastructure/controllers/authelia/secrets.yaml's
# authelia-oidc-client-openwebui Secret — see
# docs/oauth2-proxy-authelia.md's "Generating a client-secret pair" section
# for the exact generate-then-validate procedure (same shape as Homarr's,
# just naming the client "openwebui").
#
#   kubectl create secret generic openwebui-secrets \
#     --namespace openwebui \
#     --from-literal=webui-secret-key="$(openssl rand -hex 32)" \
#     --from-literal=oidc-client-secret='<the PLAINTEXT value — must match
#         the plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client-openwebui Secret>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# --- openwebui-pipelines-auth (pipelines.yaml) ---
#
# Password Open WebUI uses to authenticate against the Pipelines service
# (POST /auth, then Bearer token on subsequent calls). Any random string;
# rotating it requires re-configuring the Open WebUI connection.
#
#   kubectl create secret generic openwebui-pipelines-auth \
#     --namespace openwebui \
#     --from-literal=password="$(openssl rand -hex 16)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# --- openwebui-langfuse (pipelines.yaml) ---
#
# Langfuse project API keys for the OpenWebUI observability integration.
# Generated via the Langfuse API (POST /api/public/keys on the Langfuse
# web service) — one key per project. The Langfuse filter pipeline reads
# these at load time via the LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY env
# vars (see pipelines.yaml).
#
# To generate: create a project in Langfuse UI (langfuse.jvos.dev), then
#   kubectl exec -n langfuse deploy/langfuse-web -- \
#     curl -s -X POST http://localhost:3000/api/public/keys \
#       -H 'Content-Type: application/json' \
#       -d '{"publicKey":"pk-lf-<chosen>","secretKey":"sk-lf-<chosen>","projectId":"<project-id>"}'
# Or use the Langfuse UI: Project Settings → API Keys → Create.
#
#   kubectl create secret generic openwebui-langfuse \
#     --namespace openwebui \
#     --from-literal=public-key='pk-lf-...' \
#     --from-literal=secret-key='sk-lf-...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# --- Imperative: install the Langfuse filter pipeline into Pipelines ---
#
# After the Pipelines pod is Ready, install the Langfuse v3 filter:
#
#   PW=$(kubectl get secret openwebui-pipelines-auth -n openwebui -o jsonpath='{.data.password}' | base64 -d)
#   TOKEN=$(curl -s -X POST http://<pipelines-pod-ip>:9099/auth -H "Content-Type: application/json" -d "{\"password\":\"$PW\"}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
#   curl -s -X POST http://<pipelines-pod-ip>:9099/pipelines/install/url \
#     -H "Authorization: Bearer $TOKEN" \
#     -H "Content-Type: application/json" \
#     -d '{"url":"https://raw.githubusercontent.com/open-webui/pipelines/main/examples/filters/langfuse_v3_filter_pipeline.py"}'
#
# --- Imperative: configure Open WebUI to use Pipelines ---
#
# Add an "OpenAI API" connection in Open WebUI pointing at Pipelines:
#   POST /api/v1/openai/{id} with url=http://openwebui-pipelines:9099/
# (done via the Open WebUI admin UI: Admin Panel → Settings → Connections,
# or via its REST API with the admin token).
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-secrets
  namespace: openwebui
type: Opaque
