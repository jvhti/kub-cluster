# clickhouse-credentials — the `default` user's password for this ClickHouse
# instance. Must exist in BOTH ns clickhouse AND ns langfuse (Langfuse's
# pods live in ns langfuse and read it via secretKeyRef from their own ns).
#
# Create (run on the cluster node, not locally):
#   PASS=$(openssl rand -hex 32)
#   kubectl create secret generic clickhouse-credentials -n clickhouse \
#     --from-literal=password="$PASS" --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic clickhouse-credentials -n langfuse \
#     --from-literal=password="$PASS" --dry-run=client -o yaml | kubectl apply -f -
#
# To rotate: regenerate, patch both copies, then
#   kubectl rollout restart deploy/clickhouse -n clickhouse
