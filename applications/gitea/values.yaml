# Chart defaults, with storage moved off Longhorn (NVMe, low capacity) onto
# the TrueNAS NFS share (bulk HDD) via csi-driver-nfs's nfs-csi StorageClass.
# Bundled postgresql-ha / valkey-cluster subcharts stay on the longhorn
# (NVMe) default StorageClass - databases need low-latency random I/O that
# NFS can't provide.

# Pin the Gitea app version above the chart's default. Chart 12.7.0's
# appVersion is 1.27.0, but 1.27.1 -> 1.27.3 are all SECURITY patch releases
# (package token-scope enforcement, attachment same-repo path checks, actions
# artifact signature verification, ...) and gitea.com has not re-tagged the
# chart for them. image.tag overrides appVersion (see the chart's
# _helpers.tpl `gitea.image`), so bump this on each new security patch rather
# than waiting for a chart release.
image:
  tag: "1.27.3"

persistence:
  storageClass: nfs-csi
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Confirmed live: gitea's own pod had NO resources set at all (chart
# default resources: {}), and the bundled postgresql-ha subchart's
# pgpool/postgresql both defaulted to resourcesPreset: "micro" (375m CPU /
# 384Mi memory limit each). pgpool's own healthcheck script was timing out
# under load ("command timed out ... after 5s"), triggering repeated
# liveness-probe kills/restarts, which is what actually broke Gitea's DB
# connectivity intermittently (seen live as "dial tcp ...:5432: connect:
# operation not permitted" in gitea's logs, and as random 401s/dropped
# sessions in the browser) — not a Gitea bug itself. Checked via a debug
# pod actually scheduled on kub-ctrl-1 (this node runs ~50 pods including
# 4 separate Postgres instances and all of Longhorn's CSI stack): load
# average 5.5–10.9 on 8 cores with real swap usage — moderately pressured,
# consistent with pgpool's tight preset being an easy first thing to fall
# over under a load spike. This bump doesn't fix general node pressure,
# just gives pgpool/gitea enough headroom to not be the most fragile thing
# on the node.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Gitea's default MAX_OPEN_CONNS is 0 (unlimited). Under a docker push burst
# (~35 parallel blob HEADs, each needing a DB connection for PAT verification)
# gitea opened more concurrent connections than the DB layer could serve
# (then pgpool's 31-client cap: "Sorry, too many clients already (53300)"),
# GetAccessTokenBySHA failed, gitea fell back to the argon2 password check,
# and the push died with a nondeterministic 401 "user's password is
# invalid". pgpool is gone now (single postgres, max_connections=100), but
# 25 still keeps a burst queueing inside gitea's pool (auth queries are
# ~1-5ms) with headroom for probes and admin psql.
deployment:
  env:
    - name: GITEA__DATABASE__MAX_OPEN_CONNS
      value: "25"

# Single postgres + single valkey instead of the chart's default HA stack
# (postgresql-ha: 3x repmgr postgres + pgpool; valkey-cluster: 3 nodes).
# Switched 2026-09-30: for a single-user homelab Gitea the HA stack was 7
# pods of overhead and the main source of outages, not protection. The
# repmgr failover logic split-brained (two primaries) during host swap
# stalls, standbys crash-looped for days re-cloning, and pgpool needed
# constant tuning (OOM kills, the client cap above). The HA subcharts' PVCs
# (data-gitea-postgresql-ha-postgresql-*, valkey-data-gitea-valkey-cluster-*)
# are left behind by the switch and can be deleted once this is stable.
postgresql-ha:
  enabled: false

valkey-cluster:
  enabled: false

postgresql:
  enabled: true
  primary:
    # Prefer the worker node (kub-node-1) over the control plane, whose host
    # (ra) saturates/thermal-throttles under combined k3s + workload CPU
    # pressure.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - kub-node-1
    # Explicit instead of the subchart's "nano" preset, which is too tight
    # for Gitea's docker-push auth bursts (see MAX_OPEN_CONNS above).
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

valkey:
  enabled: true
  architecture: standalone
  primary:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - kub-node-1

gitea:
  # Prefer the worker node (kub-node-1) over the control plane, whose host
  # (ra) saturates/thermal-throttles under combined k3s + workload CPU
  # pressure.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - kub-node-1
  service:
    ssh:
      # NodePort instead of the chart default (headless ClusterIP, 22 ->
      # 2222): HAProxy on the DMZ-forwarder LXC is SNI-based and SSH has no
      # TLS ClientHello to route on, so SSH can't share 80/443. It follows
      # the WireGuard pattern instead — a NodePort the LXC can nftables-DNAT
      # to (see infrastructure/dmz-forwarder/). Any node's IP works as the
      # DNAT target since NodePort listens on all of them, and the LXC at
      # 192.168.1.239 is the one hop that can reach both LAN clients and the
      # DMZ.
      type: NodePort
      nodePort: 30222
  config:
    server:
      # The chart sets none of these, so app.ini kept Gitea's own defaults
      # (DOMAIN/SSH_DOMAIN = git.example.com). Git over HTTPS never cared —
      # remotes are set explicitly — but every absolute URL Gitea renders was
      # wrong: the clone URLs in the web UI, and the `url`/`html_url` fields in
      # API responses, which returned things like
      # "http://git.example.com/api/v1/user/keys/1" and
      # "http://gitea-http.gitea.svc:3000/jvhti" (confirmed live). ROOT_URL is
      # the one that actually matters for what the UI shows — it's the
      # external, proxied URL, deliberately not the in-cluster
      # gitea-http:3000 the HTTPS route forwards to.
      #
      # SSH_PORT is what Gitea advertises, so clone URLs render as
      # ssh://git@gitea.jvos.dev:2222/… (non-22 forces the ssh:// form rather
      # than scp-style). 2222 rather than 22 because the DMZ-forwarder LXC's
      # own sshd owns 22 on the box that receives the DNAT. That URL is
      # correct from the internet; from the LAN it can't be, because
      # gitea.jvos.dev resolves to the gateway VIP (192.168.1.240), which has
      # no SSH listener at all. LAN clients therefore need an ssh_config
      # alias for gitea.jvos.dev pointing at 192.168.1.239 — the LXC DNATs
      # the same 2222 for LAN-sourced traffic too (see its README).
      DOMAIN: gitea.jvos.dev
      ROOT_URL: https://gitea.jvos.dev/
      SSH_DOMAIN: gitea.jvos.dev
      SSH_PORT: 2222
    service:
      # Closed off after creating the one real (admin) account by hand —
      # single-user homelab instance, no self-registration needed. Existing
      # accounts/sessions are unaffected; this only blocks new signups.
      DISABLE_REGISTRATION: true
    actions:
      # Powers the container registry build pipeline (memogram, and any
      # future custom-built image) — see
      # infrastructure/controllers/gitea-runner-amd64/ and
      # -arm64/ for the two act_runner instances (one per node
      # architecture) that actually execute workflow runs registered
      # against this instance.
      ENABLED: true
    ssh.minimum_key_sizes:
      # Chart/Gitea default (3071) rejected a real 2048-bit RSA public key
      # on first SSH-key add attempt ("key length is not enough: got 2048,
      # needs 3071"). Lowered to 2048 rather than disabling the check
      # entirely (-1) — still a real minimum, just matches what's
      # actually in use rather than turning validation off altogether.
      RSA: 2048
