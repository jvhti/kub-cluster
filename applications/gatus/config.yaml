# Gatus' main config: storage backend, OIDC auth, and the monitored
# endpoints. Mounted into the pod at /config/config.yaml (gatus.yaml).
#
# Secrets are NOT inlined here — Gatus expands ${VAR}/$VAR from its own
# process environment at load time (see "Use environment variables in
# config files" in https://github.com/TwiN/gatus#readme), so the actual
# Postgres password and OIDC client secret are injected as env vars from
# Kubernetes Secrets in gatus.yaml instead, keeping this ConfigMap safe to
# commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    storage:
      type: postgres
      path: "postgres://gatus:${GATUS_DB_PASSWORD}@gatus-postgres-rw:5432/gatus?sslmode=disable"

    ui:
      title: "jvos.dev status"
      header: "jvos.dev"

    security:
      oidc:
        issuer-url: "https://auth.jvos.dev"
        redirect-url: "https://status.jvos.dev/authorization-code/callback"
        client-id: "gatus"
        client-secret: "${GATUS_OIDC_CLIENT_SECRET}"
        scopes: ["openid", "profile", "email", "groups"]

    endpoints:
      - name: argocd
        url: "https://argocd.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: gitea
        url: "https://gitea.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # longhorn/memos/search all sit behind their own dedicated
      # oauth2-proxy instance (see docs/oauth2-proxy-authelia.md) and
      # return 403 on an unauthenticated GET / — not a redirect, so Gatus's
      # HTTP client never gets a chance to follow it to a 200 the way it
      # does for jellyfin/paperless below. Hitting /ping instead — a
      # built-in oauth2-proxy endpoint that always answers 200 and
      # deliberately bypasses auth — checks that oauth2-proxy itself (and
      # therefore its config/Secret/OIDC wiring) is alive, without needing
      # real credentials. It doesn't independently confirm the backend
      # app behind oauth2-proxy is healthy, only that the gate in front of
      # it is answering.
      - name: longhorn
        url: "https://longhorn.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: memos
        url: "https://memos.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: search
        url: "https://search.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # Same oauth2-proxy /ping reasoning as longhorn/memos/search above —
      # gates public prometheus.jvos.dev/alertmanager.jvos.dev.
      - name: prometheus
        url: "https://prometheus.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: alertmanager
        url: "https://alertmanager.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: jellyfin
        url: "https://jellyfin.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: jellyseerr
        url: "https://jellyseerr.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: jellystat
        url: "https://jellystat.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: prowlarr
        url: "https://prowlarr.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: sonarr
        url: "https://sonarr.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: radarr
        url: "https://radarr.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: bazarr
        url: "https://bazarr.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: qbittorrent
        url: "https://qbittorrent.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: paperless
        url: "https://paperless.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: books (kavita)
        url: "https://books.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: fotos (immich)
        url: "https://fotos.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: start (homarr)
        url: "https://start.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: chat (open webui)
        url: "https://chat.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: grafana
        url: "https://grafana.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: headscale
        url: "https://headscale.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # Mounted under /admin/ — bare / renders nothing (see CLAUDE.md's
      # Headscale/Headplane operational notes).
      - name: headscale-admin (headplane)
        url: "https://headscale-admin.jvos.dev/admin/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: auth (authelia)
        url: "https://auth.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # Same oauth2-proxy /ping reasoning as longhorn/memos/search above —
      # frigate (on TrueNAS) and picoclaw each sit behind their own
      # dedicated oauth2-proxy instance (see
      # infrastructure/controllers/oauth2-proxy-frigate/ and
      # -picoclaw/).
      - name: frigate
        url: "https://frigate.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: picoclaw
        url: "https://picoclaw.jvos.dev/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # Garage is an S3 API with no public HTML page and no anonymous
      # access — GET / always answers 403 AccessDenied ("Garage does not
      # support anonymous access yet"). That 403 is the healthy response
      # here: it proves the gateway + garage backend are up and answering,
      # exactly like the oauth2-proxy /ping entries do for the auth-gated
      # apps.
      - name: garage (s3)
        url: "https://s3.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 403"

      # Gatus monitoring itself — status.jvos.dev serves its 200 HTML
      # shell even unauthenticated (the OIDC gate only protects the
      # actual data), so a plain 200 check works.
      - name: gatus (this page)
        url: "https://status.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: draw (excalidash)
        url: "https://draw.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: langfuse
        url: "https://langfuse.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: paste (rustypaste)
        url: "https://paste.jvos.dev"
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # VPN data plane — the VPN is NOT headscale (that's the control
      # plane, covered by the headscale/headscale-admin entries above):
      # tailscale-router (subnet router + exit node) and wireguard
      # (break-glass UDP fallback). Neither has an HTTP/TCP endpoint to
      # probe — the tailnet 100.x overlay isn't routable from cluster
      # pods, and wireguard is UDP-only — so these query the Kubernetes
      # API directly (gatus-k8s-checker ServiceAccount, see
      # k8s-pod-check-rbac.yaml; token via ${K8S_API_TOKEN}) and check the
      # pod reports ready. allow-insecure skips TLS verification of the
      # in-cluster API server CA.
      #
      # Caveats (both documented, neither fixable from in-cluster):
      # 1. Neither VPN pod defines a readiness probe, so "ready" means
      #    "container is running" — a tailscale/WG pod that's up but
      #    disconnected from its network would still read healthy here.
      # 2. A true data-path test (a real client connecting through the
      #    exit node / completing a WG handshake) is only possible from
      #    outside the cluster — this catches crash-loops/OOM-kills/scheduling
      #    failures, not silent disconnects.
      #    (The router has a documented 130x crash-loop history, which is
      #    exactly the failure class this catches.)
      - name: tailscale-router (vpn)
        group: VPN
        url: "https://kubernetes.default.svc/api/v1/namespaces/tailscale-router/pods?labelSelector=app%3Dtailscale-router"
        headers:
          Authorization: "Bearer ${K8S_API_TOKEN}"
        allow-insecure: true
        interval: 1m
        conditions:
          - "[BODY] CONTAINS '\"ready\":true'"

      - name: wireguard (vpn)
        group: VPN
        url: "https://kubernetes.default.svc/api/v1/namespaces/wireguard/pods?labelSelector=app%3Dwireguard"
        headers:
          Authorization: "Bearer ${K8S_API_TOKEN}"
        allow-insecure: true
        interval: 1m
        conditions:
          - "[BODY] CONTAINS '\"ready\":true'"

      - name: gateway-internal VIP
        url: "tcp://192.168.1.240:443"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
