# Real value created imperatively (never committed), same convention as
# every other app's secrets.yaml in this repo. Exact key required by
# gatus.yaml's secretKeyRef: oidc-client-secret.
#
# oidc-client-secret is the PLAINTEXT half of the credential pair also
# hashed into infrastructure/controllers/authelia/secrets.yaml's
# authelia-oidc-client-gatus Secret — see docs/oauth2-proxy-authelia.md's
# "Generating a client-secret pair" section for the exact
# generate-then-validate procedure (same shape, just naming the client
# "gatus" instead of an oauth2-proxy instance — same pattern as Homarr).
#
#   kubectl create secret generic gatus-secrets \
#     --namespace gatus \
#     --from-literal=oidc-client-secret='<the PLAINTEXT value — must match
#         the plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client-gatus Secret>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: gatus-secrets
  namespace: gatus
type: Opaque
---
# The HASHED half of the same credential pair — Authelia validates the OIDC
# client secret against a hash, while Gatus (like oauth2-proxy) needs the
# plaintext. See docs/oauth2-proxy-authelia.md's "Generating a client-secret
# pair" section for the exact generate-then-validate procedure; same shape
# as Homarr/Open WebUI's pair, just naming the client "gatus".
#
#   (continuing from the CLIENT_SECRET/HASH vars generated above)
#   kubectl create secret generic authelia-oidc-client-gatus \
#     --namespace authelia \
#     --from-literal=client-secret-hash="$HASH" \
#     --dry-run=client -o yaml | kubectl apply -f -
# gatus-k8s-api-token — long-lived (5y) token for the gatus-k8s-checker
# ServiceAccount (k8s-pod-check-rbac.yaml), injected into the Gatus pod as
# ${K8S_API_TOKEN} and used by config.yaml's "VPN" group to query pod
# readiness straight from the Kubernetes API.
#
#   TOKEN=$(kubectl create token gatus-k8s-checker -n gatus --duration=43800h)
#   kubectl create secret generic gatus-k8s-api-token -n gatus \
#     --from-literal=token="$TOKEN" --dry-run=client -o yaml | kubectl apply -f -
#
# Rotate the same way after ~5y (or sooner if compromised — the token is
# read-only pods in two namespaces only). Note: the Gatus pod must be
# restarted after patching this Secret (env vars don't hot-reload).
apiVersion: v1
kind: Secret
metadata:
  name: gatus-k8s-api-token
  namespace: gatus
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-client-gatus
  namespace: authelia
type: Opaque
