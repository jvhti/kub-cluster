# Gatus (https://github.com/TwiN/gatus) — lightweight status/uptime
# monitoring dashboard, like Uptime Kuma but config-as-code (YAML) and with
# a real Postgres storage backend (config.yaml, storage.type: postgres) so
# history survives pod restarts/redeploys — unlike Uptime Kuma, which is
# SQLite-only. No PVC needed here: config is a ConfigMap, all persistent
# state (check history) lives in gatus-postgres.
#
# Auth: Gatus has native OIDC support in its own config (security.oidc —
# see config.yaml), so — same reasoning as Homarr/Open WebUI — it's its own
# Authelia OIDC client rather than sitting behind a dedicated oauth2-proxy
# instance (see infrastructure/controllers/authelia/values.yaml's "gatus"
# client entry, and docs/oauth2-proxy-authelia.md's credential-pair
# procedure, followed here even though the client terminates in Gatus
# itself rather than oauth2-proxy).
#
# NOTE: like every other app here, this Deployment does NOT hot-reload on a
# ConfigMap/Secret change (Gatus reads config.yaml once at startup) — after
# editing config.yaml or gatus-secrets, `kubectl rollout restart
# deploy/gatus -n gatus` is required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate # No local PVC — safe to roll normally, unlike the Recreate apps here with an RWO Longhorn volume
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      # Steer this pod off overkill until that's root-caused; remove once
      # confirmed fixed. Every pod scheduled there hits an identical, 100%
      # reproducible timeout dialing out to the Gateway VIP
      # (192.168.1.240:443) from the pod network namespace specifically —
      # confirmed via nsenter into a live pod's netns: the same connection
      # from the *host* netns on overkill works instantly, and the same
      # pod-netns test from pi1 works instantly too. Ruled out: stale
      # iptables masquerade rule (it's a dynamic `-j MASQUERADE`, not
      # pinned to overkill's old LAN IP), Cilium agent health (82/82
      # controllers healthy, no eBPF drops observed live), and a Cilium
      # agent restart (tried — a fresh agent + a brand-new pod created
      # after it still reproduces the same timeout). First surfaced right
      # after overkill's LAN IP changed (192.168.1.210 -> .211), but the
      # root cause is still open — see git log around 2026-09-01 for the
      # investigation. Gatus panics hard on OIDC discovery failure at
      # startup (no retry), so it crash-loops indefinitely if scheduled
      # here instead of just running degraded.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - overkill
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:stable
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: GATUS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatus-postgres-app
                  key: password
            - name: GATUS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gatus-secrets
                  key: oidc-client-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gatus
spec:
  selector:
    app: gatus
  ports:
    - port: 8080
      targetPort: 8080
