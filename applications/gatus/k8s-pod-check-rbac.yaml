# ServiceAccount + minimal RBAC so Gatus can query the Kubernetes API
# directly for pod readiness — used by the "VPN" group in config.yaml
# (tailscale-router and wireguard have no HTTP/TCP endpoint to probe: the
# tailnet 100.x overlay isn't routable from cluster pods, and wireguard is
# UDP-only, so the K8s pod status IS the health signal here).
#
# Deliberately scoped to read-only `get`/`list` on `pods` in exactly the
# two namespaces Gatus checks — nothing else.
#
# The long-lived token this SA uses is created imperatively (never
# committed) — see secrets.yaml's gatus-k8s-api-token comment for the
# exact command and rotation procedure.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus-k8s-checker
  namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gatus-k8s-checker
  namespace: tailscale-router
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gatus-k8s-checker
  namespace: wireguard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gatus-k8s-checker
  namespace: tailscale-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gatus-k8s-checker
subjects:
  - kind: ServiceAccount
    name: gatus-k8s-checker
    namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gatus-k8s-checker
  namespace: wireguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gatus-k8s-checker
subjects:
  - kind: ServiceAccount
    name: gatus-k8s-checker
    namespace: gatus
