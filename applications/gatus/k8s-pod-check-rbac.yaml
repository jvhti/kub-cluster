# ServiceAccount + minimal RBAC so the gatus pod's vpn-sidecar (gatus.yaml)
# can query the Kubernetes API for pod readiness — powers the "VPN" group in
# config.yaml (tailscale-router and wireguard have no HTTP/TCP endpoint to
# probe: the tailnet 100.x overlay isn't routable from cluster pods, and
# wireguard is UDP-only, so the K8s pod status IS the health signal here).
#
# Deliberately scoped to read-only `get`/`list` on `pods` in exactly the
# two namespaces the sidecar checks — nothing else.
#
# The sidecar authenticates with this SA's own auto-mounted token (rotated
# by the kubelet, always fresh) — no long-lived token or secret to manage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus-k8s-checker
  namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gatus-k8s-checker
  namespace: tailscale-router
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gatus-k8s-checker
  namespace: wireguard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gatus-k8s-checker
  namespace: tailscale-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gatus-k8s-checker
subjects:
  - kind: ServiceAccount
    name: gatus-k8s-checker
    namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gatus-k8s-checker
  namespace: wireguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gatus-k8s-checker
subjects:
  - kind: ServiceAccount
    name: gatus-k8s-checker
    namespace: gatus
