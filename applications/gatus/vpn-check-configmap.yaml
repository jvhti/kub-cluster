# vpn-sidecar's check script (see gatus.yaml for the sidecar container).
#
# Why a sidecar instead of gatus calling the K8s API directly with a
# long-lived token: the pod's own auto-mounted ServiceAccount token is the
# reliable credential (it's always fresh, rotated by the kubelet, and works
# from the pod network). gatus itself can't read a file into an HTTP header,
# so a tiny sidecar that CAN read the token file does the K8s API check and
# exposes a plain HTTP health endpoint that gatus monitors. No static token
# to rotate, no secret, no gatus env-var token expansion edge cases.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-vpn-check
  namespace: gatus
data:
  check.py: |
    import http.server, json, ssl, urllib.request

    TOKEN = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CHECKS = {
        "/tailscale": ("tailscale-router", "app%3Dtailscale-router"),
        "/wireguard": ("wireguard", "app%3Dwireguard"),
    }

    def pod_ready(ns, label_selector):
        token = open(TOKEN).read().strip()
        url = ("https://kubernetes.default.svc/api/v1/namespaces/" + ns +
               "/pods?labelSelector=" + label_selector)
        req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
        ctx = ssl._create_unverified_context()
        with urllib.request.urlopen(req, context=ctx, timeout=10) as r:
            items = json.loads(r.read()).get("items", [])
        if not items:
            return False
        cs = items[0].get("status", {}).get("containerStatuses", [])
        return bool(cs) and cs[0].get("ready") is True

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            path = self.path.split("?")[0]
            ok = path == "/health"
            if path in CHECKS:
                try:
                    ok = pod_ready(*CHECKS[path])
                except Exception:
                    ok = False
            body = b"ok" if ok else b"down"
            self.send_response(200 if ok else 503)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    http.server.HTTPServer(("0.0.0.0", 8090), Handler).serve_forever()
