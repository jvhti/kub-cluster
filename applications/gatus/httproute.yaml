apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: gatus
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "status.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Straight to the gatus Service, unlike memos/degoog/longhorn —
        # Gatus has its own native OIDC support (security.oidc in
        # config.yaml), so it authenticates itself via its own Authelia
        # OIDC client instead of sitting behind a dedicated oauth2-proxy
        # instance, same reasoning as applications/homarr/httproute.yaml.
        # No ReferenceGrant needed since this doesn't cross namespaces.
        - name: gatus
          port: 8080
          weight: 1
