apiVersion: v1
kind: Secret
metadata:
  name: technitium-cluster-user
  namespace: default
type: Opaque
# The actual secret data should be created using kubectl with the real value:
# kubectl create secret generic technitium-cluster-user \
#   --namespace default \
#   --from-literal=username=cluster-sync \
#   --from-literal=password='the-cluster-sync-password-here' \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# Read it back with:
# kubectl get secret technitium-cluster-user -n default \
#   -o jsonpath='{.data.password}' | base64 -d
#
# NOTE: this file is a reference copy only, documenting the expected shape —
# it is not wired into any kustomization.yaml resources: list, so ArgoCD
# never applies it (this whole directory is a reference copy anyway —
# Technitium itself runs outside the cluster, see this directory's
# README.md). Holds the `cluster-sync` Technitium user (Administrators
# group) that `POST /api/admin/cluster/initJoin` needs when adding a new
# Technitium node to the `home.litb.com.br` cluster — that call has no
# token-based alternative, and the user is duplicated onto every node by the
# cluster's Administration sync. See README.md's "Cluster" and "The
# `cluster-sync` user" sections.
