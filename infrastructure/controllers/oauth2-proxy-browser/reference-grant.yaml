apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-browser-httproute
  namespace: oauth2-proxy-browser
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: browser
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy-browser
