apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    # Mirrored by the reflector controller (infrastructure/networking/reflector/)
    # into any namespace that also needs this same Cloudflare token, e.g.
    # external-dns. See infrastructure/networking/external-dns/kustomization.yaml.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "external-dns"
type: Opaque
# The actual secret data should be created using kubectl with real values:
# kubectl create secret generic cloudflare-api-token \
#   --namespace cert-manager \
#   --from-literal=api-token='your-api-token-here' \
#   --from-literal=email='your-cloudflare-email-here' \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: this file is intentionally commented out of kustomization.yaml's
# resources: list (see that file) — it documents the expected shape but isn't
# applied by ArgoCD. The annotations above must also be applied directly to
# the live Secret (kubectl annotate/edit) for reflection to actually happen,
# since GitOps isn't managing this object today.
