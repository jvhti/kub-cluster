# See infrastructure/controllers/authelia/secrets.yaml for how the
# referenced Secret names/keys below get their real values.
#
# authentication_backend / identity_providers / session / storage must live
# under configMap: — they are NOT valid top-level keys in this chart's
# values.schema.json (confirmed by a real build error: "additional
# properties 'authentication_backend', 'identity_providers', 'session',
# 'storage' not allowed" at the root).

# configMap.storage.local.path ('/config/db.sqlite3') was, until this was
# added, sitting on plain unnamed container storage with NO backing
# volume at all — confirmed directly from this chart's own deployment
# template: it only falls back to an explicit emptyDir when BOTH
# pod.extraVolumes and pod.extraVolumeMounts are empty, and this file
# already populates both (for users-database/oidc-issuer-key/
# oidc-client-secret* below) — so neither the emptyDir fallback nor a
# real PVC applied. Every pod restart/reschedule silently wiped
# db.sqlite3, which holds OIDC opaque subject identifiers, consent
# records, and sessions. Confirmed as a real, live bug: a routine
# authelia restart (during Homarr's OIDC setup) regenerated a new `sub`
# for an already-linked user, breaking Homarr's stored account link with
# OAuthAccountNotLinked — any future OIDC client would hit the same
# class of breakage on every Authelia restart. persistence.enabled adds
# a proper Longhorn-backed PVC mounted at /config (the chart's own
# hardcoded mount path for this volume, not configurable).
persistence:
  enabled: true
  storageClass: longhorn
  size: 500Mi # db.sqlite3 + notification.txt only — tiny, generous headroom over the chart's 100Mi default

pod:
  # Chart defaults to DaemonSet (one pod per node). Combined with
  # configMap.storage.local (SQLite, local to each pod) that meant 3
  # independent pods with independent databases and no shared session
  # state, sitting behind a load-balanced Gateway — any multi-request flow
  # (like the OIDC authorization code exchange) that landed on two
  # different pods failed. Confirmed via a real login attempt: "error
  # selecting oauth2 consent session ...: sql: no rows in result set".
  # Single-replica Deployment fixes it — one pod, one DB, no cross-pod
  # session issues (acceptable for a single-admin home-lab setup).
  kind: 'Deployment'
  replicas: 1
  extraVolumes:
    - name: users-database
      secret:
        secretName: authelia-users
    - name: oidc-issuer-key
      secret:
        secretName: authelia-crypto
        items:
          - key: oidc-issuer-private-key
            path: oidc-issuer-private-key.pem
    - name: oidc-client-secret
      secret:
        secretName: authelia-oidc-client
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-degoog
      secret:
        secretName: authelia-oidc-client-degoog
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-memos
      secret:
        secretName: authelia-oidc-client-memos
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-homarr
      secret:
        secretName: authelia-oidc-client-homarr
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-openwebui
      secret:
        secretName: authelia-oidc-client-openwebui
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-prometheus
      secret:
        secretName: authelia-oidc-client-prometheus
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-alertmanager
      secret:
        secretName: authelia-oidc-client-alertmanager
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-gatus
      secret:
        secretName: authelia-oidc-client-gatus
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
  extraVolumeMounts:
    - name: users-database
      mountPath: /config/users_database.yml
      subPath: users_database.yml
      readOnly: true
    - name: oidc-issuer-key
      mountPath: /secrets/oidc-issuer-private-key.pem
      subPath: oidc-issuer-private-key.pem
      readOnly: true
    - name: oidc-client-secret
      mountPath: /secrets/client-secret-hash.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-degoog
      mountPath: /secrets/client-secret-hash-degoog.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-memos
      mountPath: /secrets/client-secret-hash-memos.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-homarr
      mountPath: /secrets/client-secret-hash-homarr.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-openwebui
      mountPath: /secrets/client-secret-hash-openwebui.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-prometheus
      mountPath: /secrets/client-secret-hash-prometheus.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-alertmanager
      mountPath: /secrets/client-secret-hash-alertmanager.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-gatus
      mountPath: /secrets/client-secret-hash-gatus.txt
      subPath: client-secret-hash.txt
      readOnly: true

configMap:
  authentication_backend:
    file:
      enabled: true
      path: '/config/users_database.yml'
      password:
        algorithm: 'argon2'

  session:
    name: 'authelia_session'
    same_site: 'lax'
    expiration: '1 year'
    inactivity: '1 month'
    remember_me: '1 month'
    encryption_key:
      secret_name: authelia-crypto
      path: session-encryption-key
    # 'cookies' is required (chart default is an empty list). domain must
    # be the parent jvos.dev (not auth.jvos.dev) so the session cookie is
    # shared across subdomains — oauth2-proxy in front of
    # longhorn.jvos.dev needs to see the same cookie the login on
    # auth.jvos.dev sets.
    cookies:
      - domain: 'jvos.dev'
        subdomain: 'auth' # combines with domain to build https://auth.jvos.dev — no separate authelia_url field exists (confirmed after a real "additional properties 'authelia_url' not allowed" build error).
        default_redirection_url: 'https://longhorn.jvos.dev'

  # No SMTP server exists in this cluster; filesystem notifier (writes
  # notifications, e.g. password-reset links, to a local file inside the
  # pod) is the simplest working option for a single-admin setup with no
  # self-registration/password-reset flow actually exposed anyway.
  notifier:
    filesystem:
      enabled: true
      filename: '/config/notification.txt'

  # Chart default is 'deny'; must be a real policy since no per-resource
  # access_control.rules are defined — matches the client's own
  # authorization_policy: one_factor.
  access_control:
    default_policy: 'one_factor'

  storage:
    encryption_key:
      secret_name: authelia-crypto
      path: storage-encryption-key
    local:
      enabled: true
      path: '/config/db.sqlite3'

  identity_providers:
    oidc:
      enabled: true
      hmac_secret:
        secret_name: authelia-crypto
        path: oidc-hmac-secret
      # jwks[].key uses a different shape than the other secret_name/path
      # fields here (confirmed directly from the chart's own values.yaml
      # comments: {value: <inline PEM>, path: <absolute file path>}), and
      # this validation-check template doesn't include it among the fields
      # checked against secret.additionalSecrets — so it's mounted directly
      # via pod.extraVolumes/extraVolumeMounts above instead, at the
      # absolute path referenced here.
      jwks:
        - key_id: 'main'
          algorithm: 'RS256'
          use: 'sig'
          key:
            path: '/secrets/oidc-issuer-private-key.pem'
      clients:
        - client_id: 'oauth2-proxy'
          client_name: 'oauth2-proxy (Longhorn)'
          # client_secret uses the same {value/path} shape as jwks[].key
          # (absolute file path), not the {secret_name/path} indirection —
          # confirmed directly from the chart's own values.yaml comments
          # after the {secret_name/path} form failed at runtime with
          # "open client-secret-hash: no such file or directory". Mounted
          # via pod.extraVolumes above, same pattern as the jwks key.
          client_secret:
            path: '/secrets/client-secret-hash.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://longhorn.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
        - client_id: 'oauth2-proxy-degoog'
          client_name: 'oauth2-proxy (degoog)'
          client_secret:
            path: '/secrets/client-secret-hash-degoog.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://search.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          # NOT setting token_endpoint_auth_method here, same as the
          # oauth2-proxy (Longhorn) client above — a prior change here
          # explicitly forced this to client_secret_post on both clients,
          # based on a misread of an early error message (it named
          # client_secret_post as the method Authelia's client *required*
          # at the time, not what oauth2-proxy actually sent). That "fix"
          # was reverted after confirming live that Longhorn's client
          # authenticates successfully on the chart's actual default with
          # no explicit override — degoog's real failure was an unrelated
          # client-secret mismatch (see
          # infrastructure/controllers/oauth2-proxy-degoog/secrets.yaml's
          # regeneration note) plus the browser firing the OAuth callback
          # twice for one code, which produces two different-looking
          # errors from a single underlying cause. Leave this unset unless
          # a real, reproduced-on-a-fresh-code failure says otherwise.
        - client_id: 'oauth2-proxy-memos'
          client_name: 'oauth2-proxy (memos)'
          client_secret:
            path: '/secrets/client-secret-hash-memos.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://memos.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          # NOT setting token_endpoint_auth_method — see Learning #1 in
          # docs/oauth2-proxy-authelia.md.
        - client_id: 'homarr'
          client_name: 'Homarr'
          client_secret:
            path: '/secrets/client-secret-hash-homarr.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            # Not an oauth2-proxy instance — Homarr has no "trust the
            # reverse proxy" auth mode, so it's its own OIDC client
            # authenticating straight against Authelia (see
            # applications/homarr/homarr.yaml's AUTH_OIDC_* env vars).
            # Path is Homarr's own callback route, not oauth2-proxy's
            # /oauth2/callback used by every other client here.
            - 'https://start.jvos.dev/api/auth/callback/oidc'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
        - client_id: 'openwebui'
          client_name: 'Open WebUI'
          client_secret:
            path: '/secrets/client-secret-hash-openwebui.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            # Not an oauth2-proxy instance — Open WebUI has its own OIDC
            # client support (like Homarr), authenticating straight against
            # Authelia (see applications/openwebui/openwebui.yaml's
            # OAUTH_*/OPENID_* env vars). Path is Open WebUI's own fixed
            # callback route (confirmed against its own SSO docs), not
            # oauth2-proxy's /oauth2/callback used by every other client
            # here.
            - 'https://chat.jvos.dev/oauth/oidc/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          # NOT setting token_endpoint_auth_method — see Learning #1 in
          # docs/oauth2-proxy-authelia.md.
        - client_id: 'oauth2-proxy-prometheus'
          client_name: 'oauth2-proxy (Prometheus)'
          client_secret:
            path: '/secrets/client-secret-hash-prometheus.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://prometheus.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          # NOT setting token_endpoint_auth_method — see Learning #1 in
          # docs/oauth2-proxy-authelia.md.
        - client_id: 'oauth2-proxy-alertmanager'
          client_name: 'oauth2-proxy (Alertmanager)'
          client_secret:
            path: '/secrets/client-secret-hash-alertmanager.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://alertmanager.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          # NOT setting token_endpoint_auth_method — see Learning #1 in
          # docs/oauth2-proxy-authelia.md.
        - client_id: 'gatus'
          client_name: 'Gatus'
          client_secret:
            path: '/secrets/client-secret-hash-gatus.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            # Not an oauth2-proxy instance — Gatus has its own native OIDC
            # support (security.oidc in applications/gatus/config.yaml),
            # same reasoning as Homarr/Open WebUI. Path is Gatus' own fixed
            # callback route (confirmed against its own README: "Must end
            # with /authorization-code/callback"), not oauth2-proxy's
            # /oauth2/callback used by every other client here.
            - 'https://status.jvos.dev/authorization-code/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'

ingress:
  # Top-level master switch, separate from gatewayAPI.enabled below — chart
  # defaults BOTH to false, and without this one no ingress-related
  # resource (including the HTTPRoute) is generated at all (confirmed:
  # gatewayAPI.enabled: true alone produced zero HTTPRoute).
  enabled: true
  gatewayAPI:
    enabled: true
    hostnamesOverride:
      - 'auth.jvos.dev'
    parentRefs:
      - name: gateway-internal
        namespace: gateway
        sectionName: https # Required since gateway-internal gained a third, TLSRoute-only listener (headscale-tls-passthrough) - see infrastructure/networking/gateway/gateway.yaml

# Every secret_name referenced above (configMap.session.encryption_key,
# configMap.storage.encryption_key, configMap.identity_providers.oidc.hmac_secret)
# must be registered here, or the chart's own validation template fails the
# build. Each entry's items[].path must match the `path:` value used at the
# point of reference above, since the resolved file location is
# '{secret.mountPath}/{secret_name}/{path}' (mountPath defaults to
# '/secrets') — confirmed directly from the chart's values.yaml comments.
#
# authelia-oidc-client is NOT here: client_secret uses the {value/path}
# absolute-file-path shape (like jwks[].key), not this secret_name/path
# indirection — see the client_secret comment above.
secret:
  additionalSecrets:
    authelia-crypto:
      items:
        - key: session-encryption-key
          path: session-encryption-key
        - key: storage-encryption-key
          path: storage-encryption-key
        - key: oidc-hmac-secret
          path: oidc-hmac-secret
        # oidc-issuer-private-key is intentionally NOT here — it's mounted
        # separately via pod.extraVolumes above (see the jwks comment).
