# See infrastructure/controllers/authelia/secrets.yaml for how the
# referenced Secret names/keys below get their real values.
#
# authentication_backend / identity_providers / session / storage must live
# under configMap: — they are NOT valid top-level keys in this chart's
# values.schema.json (confirmed by a real build error: "additional
# properties 'authentication_backend', 'identity_providers', 'session',
# 'storage' not allowed" at the root).

pod:
  # Chart defaults to DaemonSet (one pod per node). Combined with
  # configMap.storage.local (SQLite, local to each pod) that meant 3
  # independent pods with independent databases and no shared session
  # state, sitting behind a load-balanced Gateway — any multi-request flow
  # (like the OIDC authorization code exchange) that landed on two
  # different pods failed. Confirmed via a real login attempt: "error
  # selecting oauth2 consent session ...: sql: no rows in result set".
  # Single-replica Deployment fixes it — one pod, one DB, no cross-pod
  # session issues (acceptable for a single-admin home-lab setup).
  kind: 'Deployment'
  replicas: 1
  extraVolumes:
    - name: users-database
      secret:
        secretName: authelia-users
    - name: oidc-issuer-key
      secret:
        secretName: authelia-crypto
        items:
          - key: oidc-issuer-private-key
            path: oidc-issuer-private-key.pem
    - name: oidc-client-secret
      secret:
        secretName: authelia-oidc-client
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
    - name: oidc-client-secret-degoog
      secret:
        secretName: authelia-oidc-client-degoog
        items:
          - key: client-secret-hash
            path: client-secret-hash.txt
  extraVolumeMounts:
    - name: users-database
      mountPath: /config/users_database.yml
      subPath: users_database.yml
      readOnly: true
    - name: oidc-issuer-key
      mountPath: /secrets/oidc-issuer-private-key.pem
      subPath: oidc-issuer-private-key.pem
      readOnly: true
    - name: oidc-client-secret
      mountPath: /secrets/client-secret-hash.txt
      subPath: client-secret-hash.txt
      readOnly: true
    - name: oidc-client-secret-degoog
      mountPath: /secrets/client-secret-hash-degoog.txt
      subPath: client-secret-hash.txt
      readOnly: true

configMap:
  authentication_backend:
    file:
      enabled: true
      path: '/config/users_database.yml'
      password:
        algorithm: 'argon2'

  session:
    name: 'authelia_session'
    same_site: 'lax'
    expiration: '1 hour'
    inactivity: '5 minutes'
    remember_me: '1 month'
    encryption_key:
      secret_name: authelia-crypto
      path: session-encryption-key
    # 'cookies' is required (chart default is an empty list). domain must
    # be the parent jvos.dev (not auth.jvos.dev) so the session cookie is
    # shared across subdomains — oauth2-proxy in front of
    # longhorn.jvos.dev needs to see the same cookie the login on
    # auth.jvos.dev sets.
    cookies:
      - domain: 'jvos.dev'
        subdomain: 'auth' # combines with domain to build https://auth.jvos.dev — no separate authelia_url field exists (confirmed after a real "additional properties 'authelia_url' not allowed" build error).
        default_redirection_url: 'https://longhorn.jvos.dev'

  # No SMTP server exists in this cluster; filesystem notifier (writes
  # notifications, e.g. password-reset links, to a local file inside the
  # pod) is the simplest working option for a single-admin setup with no
  # self-registration/password-reset flow actually exposed anyway.
  notifier:
    filesystem:
      enabled: true
      filename: '/config/notification.txt'

  # Chart default is 'deny'; must be a real policy since no per-resource
  # access_control.rules are defined — matches the client's own
  # authorization_policy: one_factor.
  access_control:
    default_policy: 'one_factor'

  storage:
    encryption_key:
      secret_name: authelia-crypto
      path: storage-encryption-key
    local:
      enabled: true
      path: '/config/db.sqlite3'

  identity_providers:
    oidc:
      enabled: true
      hmac_secret:
        secret_name: authelia-crypto
        path: oidc-hmac-secret
      # jwks[].key uses a different shape than the other secret_name/path
      # fields here (confirmed directly from the chart's own values.yaml
      # comments: {value: <inline PEM>, path: <absolute file path>}), and
      # this validation-check template doesn't include it among the fields
      # checked against secret.additionalSecrets — so it's mounted directly
      # via pod.extraVolumes/extraVolumeMounts above instead, at the
      # absolute path referenced here.
      jwks:
        - key_id: 'main'
          algorithm: 'RS256'
          use: 'sig'
          key:
            path: '/secrets/oidc-issuer-private-key.pem'
      clients:
        - client_id: 'oauth2-proxy'
          client_name: 'oauth2-proxy (Longhorn)'
          # client_secret uses the same {value/path} shape as jwks[].key
          # (absolute file path), not the {secret_name/path} indirection —
          # confirmed directly from the chart's own values.yaml comments
          # after the {secret_name/path} form failed at runtime with
          # "open client-secret-hash: no such file or directory". Mounted
          # via pod.extraVolumes above, same pattern as the jwks key.
          client_secret:
            path: '/secrets/client-secret-hash.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://longhorn.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          # Chart default is client_secret_basic, but oauth2-proxy's OIDC
          # provider (legacy --upstream/extraArgs mode, no flag exists to
          # change this) always sends the client secret via
          # client_secret_post at the token endpoint instead — confirmed
          # live via a real login attempt against the degoog client below,
          # which hit "invalid_client ... token_endpoint_auth_method
          # 'client_secret_post', however the OAuth 2.0 client registration
          # does not allow this method". This client shares the exact same
          # oauth2-proxy chart/args shape, so it was hitting the identical
          # failure on every login — just not noticed yet since it hadn't
          # been logged into recently. Explicitly allowing
          # client_secret_post here is the fix, not changing oauth2-proxy
          # (it has no config for this).
          token_endpoint_auth_method: 'client_secret_post'
        - client_id: 'oauth2-proxy-degoog'
          client_name: 'oauth2-proxy (degoog)'
          client_secret:
            path: '/secrets/client-secret-hash-degoog.txt'
          public: false
          authorization_policy: 'one_factor'
          redirect_uris:
            - 'https://search.jvos.dev/oauth2/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post' # see the oauth2-proxy client's comment above — same root cause, same fix.

ingress:
  # Top-level master switch, separate from gatewayAPI.enabled below — chart
  # defaults BOTH to false, and without this one no ingress-related
  # resource (including the HTTPRoute) is generated at all (confirmed:
  # gatewayAPI.enabled: true alone produced zero HTTPRoute).
  enabled: true
  gatewayAPI:
    enabled: true
    hostnamesOverride:
      - 'auth.jvos.dev'
    parentRefs:
      - name: gateway-internal
        namespace: gateway
        sectionName: https # Required since gateway-internal gained a third, TLSRoute-only listener (headscale-tls-passthrough) - see infrastructure/networking/gateway/gateway.yaml

# Every secret_name referenced above (configMap.session.encryption_key,
# configMap.storage.encryption_key, configMap.identity_providers.oidc.hmac_secret)
# must be registered here, or the chart's own validation template fails the
# build. Each entry's items[].path must match the `path:` value used at the
# point of reference above, since the resolved file location is
# '{secret.mountPath}/{secret_name}/{path}' (mountPath defaults to
# '/secrets') — confirmed directly from the chart's values.yaml comments.
#
# authelia-oidc-client is NOT here: client_secret uses the {value/path}
# absolute-file-path shape (like jwks[].key), not this secret_name/path
# indirection — see the client_secret comment above.
secret:
  additionalSecrets:
    authelia-crypto:
      items:
        - key: session-encryption-key
          path: session-encryption-key
        - key: storage-encryption-key
          path: storage-encryption-key
        - key: oidc-hmac-secret
          path: oidc-hmac-secret
        # oidc-issuer-private-key is intentionally NOT here — it's mounted
        # separately via pod.extraVolumes above (see the jwks comment).
