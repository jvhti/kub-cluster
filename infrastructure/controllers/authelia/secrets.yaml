apiVersion: v1
kind: Secret
metadata:
  name: authelia-crypto
  namespace: authelia
type: Opaque
# Real values created imperatively (never committed) — matches the
# infrastructure/controllers/cert-manager/cloudflare-secret.yaml convention.
# Generate and create with:
#
#   kubectl create secret generic authelia-crypto \
#     --namespace authelia \
#     --from-literal=session-encryption-key="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=storage-encryption-key="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=oidc-hmac-secret="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-file=oidc-issuer-private-key=<(openssl genrsa 4096) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Keys referenced by values.yaml's secret_name/path pairs:
#   session.encryption_key            -> secret_name: authelia-crypto, path: session-encryption-key
#   storage.encryption_key            -> secret_name: authelia-crypto, path: storage-encryption-key
#   identity_providers.oidc.hmac_secret -> secret_name: authelia-crypto, path: oidc-hmac-secret
#   identity_providers.oidc.jwks[0].key -> secret_name: authelia-crypto, path: oidc-issuer-private-key
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-client
  namespace: authelia
type: Opaque
# The client secret oauth2-proxy authenticates to Authelia's OIDC endpoint
# with. Same value must be set on oauth2-proxy's side
# (infrastructure/controllers/oauth2-proxy/) — see that directory's secret
# file for the paired half of this credential.
#
#   kubectl create secret generic authelia-oidc-client \
#     --namespace authelia \
#     --from-literal=client-secret-hash="$(docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --random)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: identity_providers.oidc.clients[].client_secret must be the HASHED
# form (Authelia validates against a hash, unlike oauth2-proxy which needs
# the plaintext) — see Authelia's `authelia crypto hash generate` docs for
# the exact algorithm/command before creating this for real.
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: authelia
type: Opaque
# File-based authentication_backend user database, mounted into the pod and
# referenced by authentication_backend.file.path in values.yaml.
#
#   htpasswd_hash=$(docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password 'REPLACE_ME')
#   kubectl create secret generic authelia-users \
#     --namespace authelia \
#     --from-literal=users_database.yml="users:
#   admin:
#     displayname: \"jvhti\"
#     password: \"$htpasswd_hash\"
#     email: jvhti@hotmail.com
#     groups: [admins]" \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-client-degoog
  namespace: authelia
type: Opaque
# The client secret the second oauth2-proxy instance (fronting degoog) uses
# to authenticate to Authelia's OIDC endpoint — separate client/secret pair
# from authelia-oidc-client above because it's a separate oauth2-proxy
# instance/redirect_uri (see infrastructure/controllers/oauth2-proxy-degoog/
# for why this isn't just reusing the Longhorn one). Same value must be set
# on that instance's side — see that directory's secrets.yaml for the paired
# half of this credential.
#
#   kubectl create secret generic authelia-oidc-client-degoog \
#     --namespace authelia \
#     --from-literal=client-secret-hash="$(docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --random)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: identity_providers.oidc.clients[].client_secret must be the HASHED
# form (Authelia validates against a hash, unlike oauth2-proxy which needs
# the plaintext) — see Authelia's `authelia crypto hash generate` docs for
# the exact algorithm/command before creating this for real.
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-client-memos
  namespace: authelia
type: Opaque
# The client secret the third oauth2-proxy instance (fronting memos) uses to
# authenticate to Authelia's OIDC endpoint — separate client/secret pair from
# the other two, same reasoning as authelia-oidc-client-degoog above (each
# oauth2-proxy instance needs its own redirect_uri). Same value must be set
# on that instance's side — see
# infrastructure/controllers/oauth2-proxy-memos/secrets.yaml for the paired
# half of this credential. Generate this pair using the procedure in
# docs/oauth2-proxy-authelia.md ("Generating a client-secret pair") — NOT the
# --random one-liner shown for the other two clients above, since that
# runbook was written specifically to avoid the --random/--password footgun
# documented there (Learning #2).
#
# NOTE: identity_providers.oidc.clients[].client_secret must be the HASHED
# form (Authelia validates against a hash, unlike oauth2-proxy which needs
# the plaintext).
