apiVersion: v1
kind: Secret
metadata:
  name: headplane-credentials
  namespace: headscale
type: Opaque
# Real values created imperatively (never committed) — matches the
# infrastructure/controllers/cert-manager/cloudflare-secret.yaml convention.
#
# 1. Generate a Headscale API key for Headplane's server-side API calls:
#
#      ssh root@10.1.254.254
#      kubectl exec -it deploy/headscale -n headscale -- \
#        headscale apikeys create --expiration 90d
#
# 2. Generate a 32-char cookie secret and create the Secret:
#
#      kubectl create secret generic headplane-credentials \
#        --namespace headscale \
#        --from-literal=headscale-api-key='<key from step 1>' \
#        --from-literal=cookie-secret="$(openssl rand -base64 24)" \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: this Secret's name must be added to infrastructure/controllers/
# argocd/values.yaml's resource.customizations.ignoreDifferences.Secret
# jqPathExpressions, otherwise ArgoCD's selfHeal wipes the real values back
# to empty on the next reconcile (see [[argocd-selfheal-live-patches]] in
# memory - same fix already applied for tailscale-authkey and others).
