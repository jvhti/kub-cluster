apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headscale

resources:
  - namespace.yaml
  - ip-pool.yaml
  - gateway.yaml
  - certificate.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - tlsroute.yaml
  # Headplane: web admin UI for Headscale (headscale.jvos.dev has no web UI
  # of its own, only API/control endpoints). Deployed into this same
  # namespace/Application - rather than its own ApplicationSet-discovered
  # directory - specifically so it can mount headscale-config (configmap.yaml
  # above) read-only for its optional "show current Headscale config" panel;
  # ConfigMap mounts can't cross namespaces, and this repo's Applications are
  # one-namespace-per-directory.
  - headplane-secrets.yaml
  - headplane-configmap.yaml
  - headplane-pvc.yaml
  - headplane-deployment.yaml
  - headplane-service.yaml
  - headplane-httproute.yaml

# Headscale gets its own dedicated Gateway (gateway.yaml) + TLSRoute, not an
# HTTPRoute on the shared gateway-internal like every other app - see
# gateway.yaml for the two independent reasons why (TLS passthrough for the
# Noise protocol's custom Upgrade header, and a Cilium bug that rules out
# combining route kinds on one Gateway).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "7" # Same wave as gateway-internal itself (gateway/gateway.yaml) - both just need the ClusterIssuer (wave 5) ready to issue their respective Certificates
