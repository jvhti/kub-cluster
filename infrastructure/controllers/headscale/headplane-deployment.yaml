apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headplane
  template:
    metadata:
      labels:
        app: headplane
    spec:
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane:0.7.0 # renovate: github-releases=tale/headplane (note: image tags on ghcr.io drop the "v" prefix GitHub release tags use)
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /etc/headplane
              readOnly: true
            - name: headscale-config
              mountPath: /etc/headscale
              readOnly: true
            - name: secrets
              mountPath: /etc/headplane/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/headplane
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /bin/hp_healthcheck is the image's own dedicated healthcheck
          # binary (used by its built-in Docker HEALTHCHECK) - used here
          # instead of an httpGet probe since the UI's actual root path is
          # /admin, not /, and a plain GET / may not reliably indicate health.
          readinessProbe:
            exec:
              command: ["/bin/hp_healthcheck"]
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/hp_healthcheck"]
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: headplane-config
        - name: headscale-config
          # Read-only view of Headscale's own config.yaml (headscale.config_path)
          # so Headplane can display current settings in the UI. Headplane
          # cannot write changes back through this mount (kubernetes
          # integration is disabled - see configmap.yaml) - it's display-only.
          configMap:
            name: headscale-config
        - name: secrets
          secret:
            secretName: headplane-credentials
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
