apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      base_url: "https://headscale-admin.jvos.dev"
      cookie_secret_path: /etc/headplane/secrets/cookie-secret
      cookie_secure: true
      data_path: /var/lib/headplane

    headscale:
      # Public hostname, not the in-cluster Service DNS name - Headscale's
      # cert (certificate.yaml) is issued for headscale.jvos.dev only, so TLS
      # hostname verification fails against headscale.headscale.svc.cluster.
      # local even though that's reachable pod-to-pod (confirmed live:
      # "Headscale unreachable at boot" using the Service DNS name). Traffic
      # still stays inside the cluster/LAN via coredns-custom's split-horizon
      # override (infrastructure/networking/coredns-custom/) rather than
      # round-tripping out to the public IP.
      url: "https://headscale.jvos.dev"
      public_url: "https://headscale.jvos.dev"
      config_path: /etc/headscale/config.yaml
      api_key_path: /etc/headplane/secrets/headscale-api-key

    integration:
      agent:
        enabled: false
      docker:
        enabled: false
      kubernetes:
        enabled: false
        # Required by Headplane's config schema even when disabled (confirmed
        # live: "integration.kubernetes.pod_name must be a string (was
        # missing)" otherwise). Meaningless here since kubernetes.enabled is
        # false - Headplane runs as its own separate Deployment rather than a
        # sidecar in Headscale's pod, talking to it purely over the HTTP API.
        pod_name: "headplane"
      proc:
        enabled: false
