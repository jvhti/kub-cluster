apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    # Plain :443 - the DMZ-forwarder LXC (infrastructure/dmz-forwarder/)
    # SNI-routes external :443 traffic between gateway-internal (everything
    # else) and gateway-headscale (this) based on the TLS ClientHello's SNI,
    # so gateway-headscale doesn't need its own external port anymore. Used
    # to be :8443 (router "forwarded" WAN:8443 -> this Gateway's VIP:443) -
    # dropped once the router turned out to be DMZ-only, no per-port
    # forwarding at all, which made the old setup silently stop working for
    # external clients entirely (confirmed live: neither :8443 nor :443
    # reached headscale externally right before this fix).
    server_url: https://headscale.jvos.dev:443
    listen_addr: 0.0.0.0:8443 # Purely internal container listen port - unrelated to the external port above, the Service (service.yaml) maps public 443 -> this regardless
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: false

    # Headscale terminates TLS itself rather than gateway-internal doing it -
    # required for TLS passthrough (see the long comment in kustomization.yaml
    # for why: Cilium's Gateway/Envoy rejects the custom
    # "tailscale-control-protocol" Upgrade header client registration needs
    # under normal HTTPS/Terminate routing). Cert issued by certificate.yaml,
    # same cloudflare-cluster-issuer as the shared wildcard cert.
    tls_cert_path: /etc/headscale/tls/tls.crt
    tls_key_path: /etc/headscale/tls/tls.key

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    # MagicDNS domain devices are named under (e.g. mylaptop.tailnet.jvos.dev).
    # Purely internal to the tailnet - Headscale serves this itself over the
    # WireGuard mesh, it's never published in public jvos.dev DNS.
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    dns:
      magic_dns: true
      base_domain: tailnet.jvos.dev
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1

    # Embedded STUN/DERP server left disabled rather than exposed: clients
    # fall back to Tailscale's public DERP relays for NAT traversal, which is
    # simpler (no extra UDP port-forward on the router) and sufficient for a
    # single-region homelab. Revisit if P2P connectivity between devices ends
    # up poor.
    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h

    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"

    log:
      level: info
