apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on a single RWO volume - no rolling update, avoid two pods touching the DB file at once
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:0.29.3 # renovate: github-releases=juanfont/headscale (0.27.0+ required by Headplane - see headplane-configmap.yaml)
          args: ["serve"]
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9090
            - name: grpc
              containerPort: 50443
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: socket
              mountPath: /var/run/headscale
            - name: tls
              mountPath: /etc/headscale/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: socket
          emptyDir: {}
        - name: tls
          secret:
            secretName: headscale-tls
