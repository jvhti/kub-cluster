apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-router
  namespace: tailscale-router
spec:
  replicas: 1
  strategy:
    type: Recreate # Single tailnet node identity persisted on the RWO volume - avoid two pods racing to use it
  selector:
    matchLabels:
      app: tailscale-router
  template:
    metadata:
      labels:
        app: tailscale-router
    spec:
      serviceAccountName: tailscale-router
      # Pinned to overkill: it is the only node whose kubelet allows the
      # unsafe sysctls below (net.ipv4.ip_forward, net.ipv6.conf.all.forwarding).
      # Confirmed live: after a NotIn-overkill pin, kub-ctrl-1 rejected the pod
      # with SysctlForbidden and crash-looped it 130x. (Proper fix: add
      # --allowed-unsafe-sysctls=net.ipv4.ip_forward,net.ipv6.conf.all.forwarding
      # to another node's k3s kubelet args, then drop this pin.)
      #
      # overkill is also the BPIP owner node for the gateway VIPs
      # (192.168.1.240/.241) and in the current cilium dev build
      # (v1.35.9-1770979049-*) its local pod->proxy-port BPF redirect is
      # broken: pods scheduled there can reach nothing on .240/.241 (host
      # path and cross-node pod paths both work - confirmed live with cilium
      # monitor: the pod's SYN reaches "proxy port 15532" and vanishes, while
      # curl to 127.0.0.1:15532 on the host itself returns 200). Without a
      # workaround tailscaled can't reach headscale (headscale.jvos.dev ->
      # .241) to log in.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - overkill
      # Workaround for the broken pod->.241 path on overkill: resolve
      # headscale.jvos.dev straight to headscale's ClusterIP instead of the
      # gateway BPIP. Works because gateway-headscale is TLS *passthrough*
      # (the headscale pod terminates TLS itself on :8443 with its own cert),
      # so the plain ClusterIP Service carries the identical, valid TLS
      # endpoint. Verified live from a pod pinned to overkill:
      #   curl --resolve headscale.jvos.dev:443:10.43.169.125 https://headscale.jvos.dev:443 -> 200
      #   curl --resolve headscale.jvos.dev:443:192.168.1.241  https://headscale.jvos.dev:443 -> timeout
      # Fragile: the ClusterIP changes if the Service is deleted/recreated
      # (check `kubectl get svc headscale -n headscale`). Remove this
      # hostAlias (and the pin above) once the cilium build is fixed.
      hostAliases:
        - ip: 10.43.169.125
          hostnames:
            - headscale.jvos.dev
      # Required for subnet routing / exit-node packet forwarding to actually
      # work, not just for the boot script to stop hanging - confirmed live:
      # "Subnet routing is enabled, but IP forwarding is disabled" health
      # warning, and the boot script's own post-`tailscale up` consistency
      # check hung for ~60s before giving up ("failed to auth tailscale:
      # context deadline exceeded"), causing a permanent crash loop even
      # though the client had already logged in successfully moments before.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv6.conf.all.forwarding
            value: "1"
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.102.2 # renovate: github-releases=tailscale/tailscale (Headscale 0.29's minimum supported client is v1.80 - see headscale/deployment.yaml)
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-authkey
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: tailscale # Node state (identity, keys) stored in this Kubernetes Secret instead of a file - see rbac.yaml for why, survives pod reschedule without needing a PVC
            - name: TS_AUTH_ONCE
              value: "true" # Defaults to false, which forces a full fresh login/auth handshake on every container restart instead of reusing TS_KUBE_SECRET's persisted state - confirmed live as the likely cause of a repeating crash loop (boot script's post-login consistency check timing out roughly once a minute, "failed to auth tailscale: context deadline exceeded", despite the client itself logging in successfully each time first)
            - name: TS_USERSPACE
              value: "false" # Use the kernel WireGuard/TUN data path (needs NET_ADMIN + /dev/net/tun below) rather than userspace networking, so routes/exit-node actually forward packets
            - name: TS_EXTRA_ARGS
              value: >-
                --login-server=https://headscale.jvos.dev:443
                 --advertise-routes=192.168.1.0/24,10.42.0.0/16,10.2.0.0/16,10.1.0.0/16
                --advertise-exit-node
                --accept-routes
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
