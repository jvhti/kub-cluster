apiVersion: v1
kind: Secret
metadata:
  name: tailscale-authkey
  namespace: tailscale-router
type: Opaque
# Real value created imperatively (never committed) — matches the
# infrastructure/controllers/cert-manager/cloudflare-secret.yaml convention.
#
# 1. Generate a reusable pre-auth key from Headscale itself (run once
#    Headscale is up and a user exists — see infrastructure/controllers/
#    headscale/ for the "headscale users create" step):
#
#      ssh root@10.1.254.254
#      kubectl exec -it deploy/headscale -n headscale -- \
#        headscale preauthkeys create --user jvhti --reusable --expiration 90d
#
# 2. Create the Secret with that key:
#
#      kubectl create secret generic tailscale-authkey \
#        --namespace tailscale-router \
#        --from-literal=TS_AUTHKEY='<key from step 1>' \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: this Secret's name must be (and already is) listed in
# infrastructure/controllers/argocd/values.yaml's
# resource.customizations.ignoreDifferences.Secret jqPathExpressions,
# otherwise ArgoCD's selfHeal wipes the real key back to empty on the next
# reconcile (confirmed happening in practice for other imperatively-managed
# Secrets in this repo — see [[argocd-selfheal-live-patches]] in memory).
