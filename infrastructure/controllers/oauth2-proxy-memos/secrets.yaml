apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-memos-credentials
  namespace: oauth2-proxy-memos
type: Opaque
# Real values created imperatively (never committed) — same convention as
# infrastructure/controllers/oauth2-proxy-degoog/secrets.yaml. Exact keys
# required by the chart's config.existingSecret path: client-id,
# client-secret, cookie-secret. See docs/oauth2-proxy-authelia.md's "Quick
# guide" / "Generating a client-secret pair" sections for the exact commands
# (they must be generated together with authelia-oidc-client-memos below —
# same plaintext, one hashed, one not).
#
#   kubectl create secret generic oauth2-proxy-memos-credentials \
#     --namespace oauth2-proxy-memos \
#     --from-literal=client-id='oauth2-proxy-memos' \
#     --from-literal=client-secret='<the PLAINTEXT value — must match the
#         plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client-memos Secret>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | head -c 32 | base64)" \
#     --dry-run=client -o yaml | kubectl apply -f -
