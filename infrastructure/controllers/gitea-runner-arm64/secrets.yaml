apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-arm64-token
  namespace: gitea-runner-arm64
type: Opaque
# Real value created imperatively (never committed) — see
# infrastructure/controllers/gitea-runner-amd64/secrets.yaml's comment for
# the full explanation (same convention, separate registration token per
# runner instance — tokens aren't meant to be shared across runners).
#
#   TOKEN=$(kubectl exec -n gitea deploy/gitea -- gitea actions generate-runner-token)
#   kubectl create secret generic gitea-runner-arm64-token \
#     --namespace gitea-runner-arm64 \
#     --from-literal=token="$TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
