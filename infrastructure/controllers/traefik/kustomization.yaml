apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pangolin

resources:
  - certificate.yaml
  - httproute.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.2.0 # renovate: github-releases=traefik/traefik-helm-chart
    releaseName: traefik
    namespace: pangolin
    valuesFile: values.yaml
    includeCRDs: true # IngressRoute/Middleware/etc - pangolin's controller reconciles against these

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0" # After cloudnative-pg (-10); pangolin/ (5+) depends on this Traefik + its Certificate being ready
