apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pangolin
  namespace: pangolin
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
  hostnames:
    - "pangolin.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Routes through this namespace's dedicated Traefik (see values.yaml) rather
        # than straight to a Pangolin Service - Traefik is what the Pangolin chart's
        # controller mode reconciles IngressRoute/Middleware CRDs against. No
        # oauth2-proxy gating here: Pangolin has its own identity/access-control
        # system (that's the point of deploying it), same reasoning as ArgoCD's own
        # HTTPRoute bypassing oauth2-proxy too.
        #
        # Port 80 (web), not 443: the Cilium Gateway already terminates public TLS
        # with the *.jvos.dev wildcard cert (spec.listeners.https in
        # infrastructure/networking/gateway/gateway.yaml) and forwards plain HTTP to
        # backends - it does not re-encrypt to a backend's HTTPS port. Pointing this
        # at Traefik's websecure (443) listener returned 404 (plain HTTP arriving on
        # a TLS-only listener with no matching route) until this was fixed.
        - name: traefik
          namespace: pangolin
          port: 80
          weight: 1
