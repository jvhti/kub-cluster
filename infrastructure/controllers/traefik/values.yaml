# Dedicated Traefik instance scoped to Pangolin only (infrastructure/controllers/pangolin/) -
# every other app in this cluster is routed by the Cilium Gateway
# (infrastructure/networking/gateway/). This Traefik exists solely because the
# Pangolin Helm chart requires a Traefik it can reconcile IngressRoute/Middleware CRDs
# against in "controller" deployment mode.
#
# No public LoadBalancer/ACME here - TLS comes from cert-manager
# (see certificate.yaml, same ClusterIssuer as the rest of the cluster) and public
# ingress rides the existing Cilium Gateway via httproute.yaml, which forwards to
# this Traefik's ClusterIP Service. Traefik itself never gets its own public IP/port.
service:
  spec:
    type: ClusterIP

# TLS certs are cert-manager-issued Secrets (see certificate.yaml) referenced
# directly on Pangolin's own IngressRoute (pangolin.ingressRoute.dashboard.tls
# in infrastructure/controllers/pangolin/values.yaml), not Traefik ACME
# resolvers - no certificatesResolvers config needed here.

# Default TLSStore: any IngressRoute Traefik serves without its own tls.secretName
# picks up this cert automatically. This is what covers Resources the
# pangolin-kube-controller creates dynamically under base_domain (p.jvos.dev,
# see infrastructure/controllers/pangolin/values.yaml's pangolin.config.domains) -
# those routes are generated by the controller itself, not hand-written, so
# there's no per-Resource place to set a secretName. Must be named "default"
# (Traefik convention) to actually apply as the fallback.
tlsStore:
  default:
    defaultCertificate:
      secretName: p-jvos-dev-wildcard-tls # see certificate-resources.yaml

ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false

# Plain Ingress provider is disabled above (this Traefik only reconciles its
# own IngressRoute CRDs for Pangolin) - no need for a cluster-wide default
# IngressClass either.
ingressClass:
  enabled: false
