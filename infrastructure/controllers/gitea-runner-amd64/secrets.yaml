apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-amd64-token
  namespace: gitea-runner-amd64
type: Opaque
# Real value created imperatively (never committed) — same convention as
# every other Secret in this repo (see CLAUDE.md's Secrets table). This is
# a Gitea Actions *registration* token: single-use to register the runner
# against the instance, then the runner persists its own long-lived
# credentials in its PVC (statefulset.persistence, chart-managed) — losing
# that PVC means generating a fresh token and re-registering, not reusing
# this one.
#
#   TOKEN=$(kubectl exec -n gitea deploy/gitea -- gitea actions generate-runner-token)
#   kubectl create secret generic gitea-runner-amd64-token \
#     --namespace gitea-runner-amd64 \
#     --from-literal=token="$TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
