apiVersion: v1
kind: Secret
metadata:
  name: pangolin-newt-credentials
  namespace: pangolin
type: Opaque
# Real values created imperatively (never committed) — matches the
# infrastructure/controllers/authelia/secrets.yaml convention. Referenced by
# values.yaml's newtInstances[].auth.existingSecretName.
#
# NEWT_ID and NEWT_SECRET come from Pangolin's dashboard (Organization ->
# Sites -> Create Site -> Newt) after the Pangolin server + Gerbil are
# already up. PANGOLIN_ENDPOINT points at the in-cluster Service rather than
# the public https://pangolin.jvos.dev hostname, so this Newt site's traffic
# to its own control plane never has to round-trip out through the Gateway.
#
#   kubectl create secret generic pangolin-newt-credentials \
#     --namespace pangolin \
#     --from-literal=PANGOLIN_ENDPOINT="http://pangolin.pangolin.svc.cluster.local:3000" \
#     --from-literal=NEWT_ID="REPLACE_ME" \
#     --from-literal=NEWT_SECRET="REPLACE_ME" \
#     --dry-run=client -o yaml | kubectl apply -f -
