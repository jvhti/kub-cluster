apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pangolin

resources:
  - secrets.yaml

helmCharts:
  - name: newt
    repo: oci://ghcr.io/fosrl/helm-charts
    version: 1.5.0 # renovate: github-tags=fosrl/helm-charts
    releaseName: pangolin-newt
    namespace: pangolin
    valuesFile: values.yaml

patches:
  # newt-1.5.0's templates/deployment.yaml never sets metadata.namespace
  # (unlike every other resource the chart renders), and kustomize's own
  # `namespace:` transformer above doesn't backfill it either - see the NOTE
  # in values.yaml. Without this it silently lands in whatever namespace
  # ArgoCD's Application destination defaults to (pangolin-newt) instead of
  # pangolin. Deployment name is deterministic: <releaseName>-<chart>-<instance>.
  - target:
      kind: Deployment
      name: pangolin-newt-newt-main-tunnel
    patch: |-
      - op: add
        path: /metadata/namespace
        value: pangolin

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10" # After pangolin/ (5) - needs the Pangolin server up first, and a site created via its dashboard to get NEWT_ID/NEWT_SECRET
