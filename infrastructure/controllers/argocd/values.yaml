configs:
  cm:
    create: true
    application.resourceTrackingMethod: "annotation+label"
    # This repo's convention (see e.g. infrastructure/controllers/authelia/secrets.yaml)
    # is to commit these Secrets empty and populate real values imperatively via
    # `kubectl create secret ... | kubectl apply -f -` out-of-band. Without this,
    # selfHeal: true (every Application's syncPolicy) reverts the live Secret back
    # to its empty committed data on the next reconcile, silently wiping real
    # credentials - confirmed happening in practice. Scoped by name via
    # jqPathExpressions rather than a blanket kind: Secret rule, so drift
    # detection still works normally on every other Secret (including
    # Helm/chart-generated ones in these same namespaces).
    resource.customizations.ignoreDifferences.Secret: |
      jqPathExpressions:
        - >-
          select(.metadata.name as $n | [
            "authelia-crypto", "authelia-oidc-client", "authelia-users",
            "oauth2-proxy-credentials", "tailscale-authkey", "headplane-credentials"
          ] | any($n == .)) | .data
    # Cilium's Gateway API controller normalizes objects by filling in default
    # group/kind fields (parentRefs, backendRefs, allowedRoutes.kinds,
    # certificateRefs) and defaulting weight to 1. These are API defaults, not
    # user intent, so ignore them to prevent perpetual OutOfSync.
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
      jqExpressionRules:
        - expression: del(.spec.listeners[].allowedRoutes.kinds[].group) | del(.spec.listeners[].tls.certificateRefs[].group, .spec.listeners[].tls.certificateRefs[].kind)
          compare: json
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqExpressionRules:
        - expression: del(.spec.parentRefs[].group, .spec.parentRefs[].kind) | del(.spec.rules[].backendRefs[].group, .spec.rules[].backendRefs[].kind) | del(.spec.rules[].backendRefs[].weight)
          compare: json
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_TLSRoute: |
      jqExpressionRules:
        - expression: del(.spec.parentRefs[].group, .spec.parentRefs[].kind) | del(.spec.rules[].backendRefs[].group, .spec.rules[].backendRefs[].kind) | del(.spec.rules[].backendRefs[].weight)
          compare: json
  cmp:
    create: true
    plugins:
      kustomize-build-with-helm:
        generate:
          command: [ "sh", "-c" ]
          args: [ "kustomize build --enable-helm" ]
  params:
    server.insecure: true

crds:
  install: true
  # -- Keep CRDs on chart uninstall
  keep: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 700Mi
    limits:
      cpu: 4000m
      memory: 2Gi

dex:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 2000m
      memory: 128Mi

server:
  service:
    # Traffic now flows through the shared gateway-internal Gateway
    # (infrastructure/networking/gateway/) via http-route.yaml instead of a
    # standalone LoadBalancer Service.
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 4000m
      memory: 256Mi

repoServer:
  containerSecurityContext:
    readOnlyRootFilesystem: true
  volumes:
    - name: cmp-kustomize-build-with-helm
      configMap:
        name: argocd-cmp-cm
    - name: cmp-tmp
      emptyDir: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 1024Mi
  extraContainers:
    - name: kustomize-build-with-helm
      command:
        - argocd-cmp-server
      image: '{{ default .Values.global.image.repository .Values.repoServer.image.repository }}:{{ default (include "argo-cd.defaultTag" .) .Values.repoServer.image.tag }}'
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ "ALL" ]
      volumeMounts:
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-kustomize-build-with-helm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: kustomize-build-with-helm.yaml
        - mountPath: /tmp
          name: cmp-tmp

applicationSet:
  # Chart 9.x changed default from 'sync' to '' - explicitly set for auto-sync
  allowedScmProviders: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi

notifications:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 128Mi
