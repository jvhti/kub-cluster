configs:
  cm:
    create: true
    application.resourceTrackingMethod: "annotation+label"
    # This repo's convention (see e.g. infrastructure/controllers/authelia/secrets.yaml)
    # is to commit these Secrets empty and populate real values imperatively via
    # `kubectl create secret ... | kubectl apply -f -` out-of-band. Without this,
    # selfHeal: true (every Application's syncPolicy) reverts the live Secret back
    # to its empty committed data on the next reconcile, silently wiping real
    # credentials - confirmed happening in practice. Scoped by name via
    # jqPathExpressions rather than a blanket kind: Secret rule, so drift
    # detection still works normally on every other Secret (including
    # Helm/chart-generated ones in these same namespaces).
    resource.customizations.ignoreDifferences.Secret: |
      jqPathExpressions:
        - >-
          select(.metadata.name as $n | [
            "authelia-crypto", "authelia-oidc-client", "authelia-users",
            "oauth2-proxy-credentials", "tailscale-authkey", "headplane-credentials"
          ] | any($n == .)) | .data
    # Cilium's Gateway API controller normalizes objects by filling in default
    # group/kind fields and defaulting weight to 1. These are API defaults, not
    # user intent, so ignore them to prevent perpetual OutOfSync.
    # - parentRefs: controller adds group + kind
    # - backendRefs: controller adds group + kind + weight
    # - Gateway listeners: controller adds group to allowedRoutes.kinds and
    #   group+kind to tls.certificateRefs
    # StatefulSet + server-side apply + API-server defaulting is a known
    # ArgoCD perpetual-OutOfSync loop (argoproj/argo-cd#11143): the gitea and
    # actions-runner charts render these three StatefulSets without their
    # default values, but the API server fills those defaults into the live
    # object at apply time (revisionHistoryLimit, dnsPolicy,
    # terminationMessagePath, probe fields, ...), and SSA can never remove
    # them - auto-heal re-applies forever without converging (the valkey one
    # had accumulated 40+ auto-heal attempts). Each path below is the exact
    # drift observed between the rendered target and the live object, and
    # every expression was validated against the real manifests with gojq,
    # the engine ArgoCD evaluates them with. The subPath expression only
    # strips null subPaths (a chart-rendering artifact), so real subPath
    # values still drift-detect. Scoped by name like the Secret rule above,
    # so every other StatefulSet keeps normal drift detection.
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jqPathExpressions:
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.persistentVolumeClaimRetentionPolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.podManagementPolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.revisionHistoryLimit
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.serviceName
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.updateStrategy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.affinity.nodeAffinity
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.affinity.podAffinity
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.dnsPolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.hostNetwork
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.restartPolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.schedulerName
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.securityContext
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.serviceAccount
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.terminationGracePeriodSeconds
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.containers[].env[].valueFrom.fieldRef.apiVersion
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.containers[].ports[]?.protocol
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.containers[].terminationMessagePath
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.containers[].terminationMessagePolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.containers[].volumeMounts[] | select(.subPath == null) | .subPath
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.imagePullPolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.resources
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.terminationMessagePath
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.terminationMessagePolicy
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.livenessProbe.failureThreshold
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.livenessProbe.periodSeconds
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.livenessProbe.successThreshold
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.livenessProbe.timeoutSeconds
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.startupProbe.failureThreshold
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.startupProbe.periodSeconds
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.startupProbe.successThreshold
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.initContainers[]?.startupProbe.timeoutSeconds
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.template.spec.volumes[].configMap.defaultMode
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.volumeClaimTemplates[].apiVersion
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.volumeClaimTemplates[].kind
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.volumeClaimTemplates[].spec.volumeMode
        - >-
          select(.metadata.name as $n | [
            "gitea-valkey-cluster", "gitea-runner-amd64-runner", "gitea-runner-arm64-runner"
          ] | any($n == .)) | .spec.volumeClaimTemplates[].status
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
      jqPathExpressions:
        - .spec.listeners[].allowedRoutes.kinds
        - .spec.listeners[].tls.certificateRefs
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
        - .spec.parentRefs
        - .spec.rules[].backendRefs
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_TLSRoute: |
      jqPathExpressions:
        - .spec.parentRefs
        - .spec.rules[].backendRefs
  cmp:
    create: true
    plugins:
      kustomize-build-with-helm:
        generate:
          command: [ "sh", "-c" ]
          args: [ "kustomize build --enable-helm" ]
  params:
    server.insecure: true

crds:
  install: true
  # -- Keep CRDs on chart uninstall
  keep: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 700Mi
    limits:
      cpu: 4000m
      memory: 2Gi

dex:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 2000m
      memory: 128Mi

server:
  service:
    # Traffic now flows through the shared gateway-internal Gateway
    # (infrastructure/networking/gateway/) via http-route.yaml instead of a
    # standalone LoadBalancer Service.
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 4000m
      memory: 256Mi

repoServer:
  containerSecurityContext:
    readOnlyRootFilesystem: true
  volumes:
    - name: cmp-kustomize-build-with-helm
      configMap:
        name: argocd-cmp-cm
    - name: cmp-tmp
      emptyDir: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 1024Mi
  extraContainers:
    - name: kustomize-build-with-helm
      command:
        - argocd-cmp-server
      image: '{{ default .Values.global.image.repository .Values.repoServer.image.repository }}:{{ default (include "argo-cd.defaultTag" .) .Values.repoServer.image.tag }}'
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ "ALL" ]
      volumeMounts:
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-kustomize-build-with-helm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: kustomize-build-with-helm.yaml
        - mountPath: /tmp
          name: cmp-tmp

applicationSet:
  # Chart 9.x changed default from 'sync' to '' - explicitly set for auto-sync
  allowedScmProviders: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi

notifications:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 128Mi
