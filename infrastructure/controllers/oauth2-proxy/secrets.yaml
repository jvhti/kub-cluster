apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-credentials
  namespace: oauth2-proxy
type: Opaque
# Real values created imperatively (never committed) — matches the
# infrastructure/controllers/cert-manager/cloudflare-secret.yaml convention.
# Exact keys required by the chart's config.existingSecret path (confirmed
# from templates/_helpers.tpl's "oauth2-proxy.secrets" definition):
#   client-id, client-secret, cookie-secret
#
#   kubectl create secret generic oauth2-proxy-credentials \
#     --namespace oauth2-proxy \
#     --from-literal=client-id='oauth2-proxy' \
#     --from-literal=client-secret='<the PLAINTEXT value — must match the
#         plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client Secret. Authelia validates against a hash;
#         oauth2-proxy needs the plaintext. These are the two halves of the
#         same credential and must be regenerated together if ever rotated>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | head -c 32 | base64)" \
#     --dry-run=client -o yaml | kubectl apply -f -
