apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # - secrets.yaml  # Real values created imperatively — see that file's comments.

helmCharts:
  - name: oauth2-proxy
    repo: https://oauth2-proxy.github.io/manifests
    version: 4.35.10 # renovate: github-releases=oauth2-proxy/manifests
    releaseName: oauth2-proxy
    namespace: oauth2-proxy
    valuesFile: values.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-2" # After authelia (-3), before Longhorn's HTTPRoute backendRef change.
