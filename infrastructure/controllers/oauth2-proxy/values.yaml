# See infrastructure/controllers/oauth2-proxy/secrets.yaml for how
# config.existingSecret's keys (client-id/client-secret/cookie-secret) get
# their real values. client-secret's plaintext must match the hash stored in
# infrastructure/controllers/authelia/secrets.yaml's authelia-oidc-client
# Secret — same underlying credential, two forms (Authelia validates
# against a hash, oauth2-proxy needs the plaintext).

config:
  existingSecret: oauth2-proxy-credentials

# NOTE: alphaConfig was tried first, but alphaConfig.enabled: true switches
# oauth2-proxy into a mode where most legacy CLI flags (including
# --oidc-issuer-url, --provider, etc.) are rejected outright — confirmed via
# a real runtime error: "unknown flag: --oidc-issuer-url" once --alpha-config
# appeared in the rendered container args alongside the legacy extraArgs
# below. --upstream is still fully supported (not removed, despite being
# superseded by alpha config's upstreamConfig) — using it keeps everything
# on the well-documented legacy CLI-flag path instead of the alpha-config
# schema, which is comparatively under-documented and easy to get subtly
# wrong.
extraArgs:
  provider: oidc
  oidc-issuer-url: https://auth.jvos.dev
  redirect-url: https://longhorn.jvos.dev/oauth2/callback
  email-domain: "*" # No group/domain restriction beyond Authelia's own single-user login gating who can authenticate at all.
  cookie-domain: .jvos.dev # Matches Authelia's session cookie domain (infrastructure/controllers/authelia/values.yaml's configMap.session.cookies) so the two share scope correctly.
  whitelist-domain: .jvos.dev
  reverse-proxy: "true" # Sits behind Cilium's Envoy Gateway — needed so X-Forwarded-* headers are honored correctly.
  set-xauthrequest: "true"
  upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
