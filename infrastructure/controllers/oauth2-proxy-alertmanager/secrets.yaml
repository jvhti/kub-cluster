apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-alertmanager-credentials
  namespace: oauth2-proxy-alertmanager
type: Opaque
# Real values created imperatively (never committed) — same convention as
# infrastructure/controllers/oauth2-proxy-degoog/secrets.yaml. Exact keys
# required by the chart's config.existingSecret path: client-id,
# client-secret, cookie-secret.
#
#   kubectl create secret generic oauth2-proxy-alertmanager-credentials \
#     --namespace oauth2-proxy-alertmanager \
#     --from-literal=client-id='oauth2-proxy-alertmanager' \
#     --from-literal=client-secret='<the PLAINTEXT value — must match the
#         plaintext that was hashed into the authelia-oidc-client-alertmanager
#         Secret (authelia ns). Authelia validates against a hash;
#         oauth2-proxy needs the plaintext. These are the two halves of the
#         same credential and must be regenerated together if ever rotated>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | head -c 32 | base64)" \
#     --dry-run=client -o yaml | kubectl apply -f -
