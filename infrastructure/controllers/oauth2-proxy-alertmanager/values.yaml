# Fifth oauth2-proxy instance, dedicated to Alertmanager
# (alertmanager.jvos.dev) — same one-instance-per-hostname reasoning as the
# other instances (the legacy CLI config is single-upstream/single-redirect-
# url and can't front two different backends; alpha-config routes by path,
# not Host). See docs/oauth2-proxy-authelia.md for the full runbook.
#
# Only traffic arriving via the public hostname (gateway-internal → this
# proxy) is auth-gated. In-cluster consumers keep reaching Alertmanager
# over the Service DNS name, which bypasses the gateway and this proxy
# entirely — Alertmanager stays public internally.
#
# See infrastructure/controllers/oauth2-proxy-alertmanager/secrets.yaml for
# how config.existingSecret's keys get their real values.

config:
  existingSecret: oauth2-proxy-alertmanager-credentials

extraArgs:
  provider: oidc
  oidc-issuer-url: https://auth.jvos.dev
  redirect-url: https://alertmanager.jvos.dev/oauth2/callback
  email-domain: "*"
  cookie-domain: .jvos.dev
  whitelist-domain: .jvos.dev
  reverse-proxy: "true"
   set-xauthrequest: "true"
   cookie-max-age: "604800"
   upstream: http://prometheus-kube-prometheus-stack-alertmanager.kube-prometheus-stack.svc.cluster.local:9093
