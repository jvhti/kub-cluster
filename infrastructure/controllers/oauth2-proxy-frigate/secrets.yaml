apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-frigate-credentials
  namespace: oauth2-proxy-frigate
type: Opaque
# Real values created imperatively (never committed) — same convention as
# infrastructure/controllers/oauth2-proxy/secrets.yaml. Exact keys required
# by the chart's config.existingSecret path: client-id, client-secret,
# cookie-secret.
#
#   kubectl create secret generic oauth2-proxy-frigate-credentials \
#     --namespace oauth2-proxy-frigate \
#     --from-literal=client-id='oauth2-proxy-frigate' \
#     --from-literal=client-secret='<the PLAINTEXT value — must match the
#         plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client-frigate Secret. Authelia validates against a
#         hash; oauth2-proxy needs the plaintext. These are the two halves
#         of the same credential and must be regenerated together if ever
#         rotated>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | head -c 32 | base64)" \
#     --dry-run=client -o yaml | kubectl apply -f -

---
apiVersion: v1
kind: Secret
metadata:
  name: frigate-proxy-secret
  namespace: oauth2-proxy-frigate
type: Opaque
# The X-Proxy-Secret value the injector sidecar (values.yaml's
# extraContainers) sends to 10.0.0.5:30193 on every hop — the only thing
# standing between a direct LAN hit on 10.0.0.5:30193 and full admin
# access to the NVR (frigate's own auth is disabled; see values.yaml's
# security-model comment). The SAME plaintext value also lives in
# frigate's config.yaml on the TrueNAS box (proxy.auth_secret,
# /mnt/General/frigate/config/config.yaml) — the two are one credential in
# two places and MUST be rotated together (see docs/frigate-true-nas.md's
# rotation procedure).
#
#   kubectl create secret generic frigate-proxy-secret \
#     --namespace oauth2-proxy-frigate \
#     --from-literal=proxy-secret="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
