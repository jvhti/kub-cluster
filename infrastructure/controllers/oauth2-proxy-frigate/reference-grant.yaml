apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-frigate-httproute
  namespace: oauth2-proxy-frigate
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: frigate
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy-frigate
