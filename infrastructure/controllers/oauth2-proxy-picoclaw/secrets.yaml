apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-picoclaw-credentials
  namespace: oauth2-proxy-picoclaw
type: Opaque
# Real values created imperatively (never committed) — same convention as
# infrastructure/controllers/oauth2-proxy/secrets.yaml. Exact keys required
# by the chart's config.existingSecret path: client-id, client-secret,
# cookie-secret.
#
#   kubectl create secret generic oauth2-proxy-picoclaw-credentials \
#     --namespace oauth2-proxy-picoclaw \
#     --from-literal=client-id='oauth2-proxy-picoclaw' \
#     --from-literal=client-secret='<the PLAINTEXT value — must match the
#         plaintext that was hashed into
#         infrastructure/controllers/authelia/secrets.yaml's
#         authelia-oidc-client-picoclaw Secret. Authelia validates against a
#         hash; oauth2-proxy needs the plaintext. These are the two halves
#         of the same credential and must be regenerated together if ever
#         rotated>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | head -c 32 | base64)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Generate the pair (this half + the authelia-oidc-client-picoclaw half)
# using the procedure in docs/oauth2-proxy-authelia.md ("Generating a
# client-secret pair") — NOT the --random one-liner (Learning #2 there:
# --random silently ignores --password).
