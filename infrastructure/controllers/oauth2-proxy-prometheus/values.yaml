# Fourth oauth2-proxy instance, dedicated to Prometheus (prometheus.jvos.dev)
# — same one-instance-per-hostname reasoning as the other instances (the
# legacy CLI config is single-upstream/single-redirect-url and can't front
# two different backends; alpha-config routes by path, not Host). See
# docs/oauth2-proxy-authelia.md for the full runbook.
#
# Only traffic arriving via the public hostname (gateway-internal → this
# proxy) is auth-gated. In-cluster consumers keep reaching Prometheus over
# the Service DNS name (e.g. Grafana's datasource uses
# http://prometheus-operated.kube-prometheus-stack.svc:9090), which bypasses
# the gateway and this proxy entirely — Prometheus stays public internally.
#
# See infrastructure/controllers/oauth2-proxy-prometheus/secrets.yaml for how
# config.existingSecret's keys get their real values.

config:
  existingSecret: oauth2-proxy-prometheus-credentials

extraArgs:
  provider: oidc
  oidc-issuer-url: https://auth.jvos.dev
  redirect-url: https://prometheus.jvos.dev/oauth2/callback
  email-domain: "*"
  cookie-domain: .jvos.dev
  whitelist-domain: .jvos.dev
  reverse-proxy: "true"
  set-xauthrequest: "true"
  cookie-max-age: "604800"
  upstream: http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090
