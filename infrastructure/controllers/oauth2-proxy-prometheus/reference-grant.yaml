apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-prometheus-httproute
  namespace: oauth2-proxy-prometheus
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-prometheus-stack
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy-prometheus
