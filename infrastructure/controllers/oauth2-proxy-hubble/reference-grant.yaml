apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-hubble-httproute
  namespace: oauth2-proxy-hubble
spec:
  # The hubble.jvos.dev HTTPRoute lives in kube-system (the cilium chart's
  # namespace, where hubble-ui runs) and points its backend at this proxy's
  # Service. Gateway API requires this grant for that cross-namespace
  # backendRef to resolve.
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy-hubble
