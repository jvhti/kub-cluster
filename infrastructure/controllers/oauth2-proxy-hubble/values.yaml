# oauth2-proxy instance dedicated to the Hubble (Cilium network observability)
# UI, hubble.jvos.dev. Same one-oauth2-proxy-instance-per-hostname reasoning as
# the other instances (the legacy CLI config is single-upstream/single-
# redirect-url). See docs/oauth2-proxy-authelia.md for the full runbook.
#
# upstream is the hubble-ui Service in kube-system (part of the cilium chart —
# a standalone React SPA the chart deploys, targetPort 8081 behind :80). Only
# traffic arriving via the public hostname (gateway-internal -> this proxy) is
# auth-gated; in-cluster consumers can still reach the UI over the Service DNS
# name (hubble-ui.kube-system.svc:80) and bypass the gateway + proxy entirely.
#
# See infrastructure/controllers/oauth2-proxy-hubble/secrets.yaml for how
# config.existingSecret's keys get their real values.

config:
  existingSecret: oauth2-proxy-hubble-credentials

extraArgs:
  provider: oidc
  oidc-issuer-url: https://auth.jvos.dev
  redirect-url: https://hubble.jvos.dev/oauth2/callback
  email-domain: "*"
  cookie-domain: hubble.jvos.dev
  whitelist-domain: .jvos.dev
  reverse-proxy: "true"
  set-xauthrequest: "true"
  cookie-expire: 168h
  upstream: http://hubble-ui.kube-system.svc.cluster.local:80
