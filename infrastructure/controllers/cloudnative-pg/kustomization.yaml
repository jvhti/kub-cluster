apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.io/charts
    version: 0.29.0 # renovate: github-releases=cloudnative-pg/charts
    releaseName: cnpg
    namespace: cnpg-system
    valuesFile: values.yaml
    includeCRDs: true

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-10" # Before pangolin/db-cluster.yaml's Cluster CR needs the operator/CRDs ready
