apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate # Single RWO volume holding peer keys/configs - avoid two pods racing to use it
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      # Pinned to kub-node-1: it allows the required unsafe sysctl
      # net.ipv4.ip_forward (confirmed live with a test pod) AND it is the
      # node the wireguard-config Longhorn PV's nodeAffinity points at -
      # pinning overkill (which also allows the sysctl) deadlocked the pod
      # in Pending ("didn't match PersistentVolume's node affinity").
      # Only kub-ctrl-1 lacks the allowlist: after the pod last left a
      # working node, replacements kept landing there and sat in
      # SysctlForbidden for 39h, piling up 1000+ zombie pods. Proper fix:
      # add the sysctl to kub-ctrl-1's k3s kubelet args, then drop this
      # pin (and tailscale-router's overkill pin).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - kub-node-1
      # net.ipv4.conf.all.src_valid_mark deliberately NOT set here despite
      # being wg-quick's usual recommendation for policy-routing setups:
      # confirmed live this crash-loops the pod (SysctlForbidden - only
      # net.ipv4.ip_forward and net.ipv6.conf.all.forwarding are in this
      # k3s cluster's kubelet allowedUnsafeSysctls, added previously for
      # tailscale-router). Not widening that allowlist cluster-wide for one
      # Deployment; the linuxserver/wireguard entrypoint's own privileged
      # startup (NET_ADMIN below) can set it inside its own netns if
      # actually needed - only the Kubernetes API-level pod field is
      # blocked here.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:latest # renovate: github-releases=linuxserver/docker-wireguard - pin to a real version once Renovate opens its first PR; using latest for now rather than guess an exact tag
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            # Baked into generated peer .conf files' Endpoint field - external
            # clients connect here. DNS record (wg.jvos.dev -> WAN IP) created
            # manually in Cloudflare, same as gateway-internal's WAN target -
            # external-dns only watches Gateway API HTTPRoute/TLSRoute
            # sources (infrastructure/networking/external-dns/values.yaml),
            # not plain Services, so it can't pick this up automatically.
            - name: SERVERURL
              value: wg.jvos.dev
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: phone,laptop
            - name: PEERDNS
              value: auto
            - name: INTERNAL_SUBNET
              value: 10.13.13.0
            - name: ALLOWEDIPS
              value: 0.0.0.0/0 # Full-tunnel per peer config; each client still chooses whether to actually route all traffic through it
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: modules
              mountPath: /lib/modules
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wireguard-config
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
