apiVersion: v1
kind: Namespace
metadata:
  name: pangolin
  labels:
    # Gerbil needs NET_ADMIN for WireGuard interface management - same PSA
    # level Longhorn's namespace uses for its privileged CSI/iSCSI needs (see
    # infrastructure/storage/longhorn/namespace.yaml).
    pod-security.kubernetes.io/enforce: privileged
