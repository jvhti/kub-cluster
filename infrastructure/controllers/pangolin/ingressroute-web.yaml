apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pangolin-dashboard-web
  namespace: pangolin
spec:
  # Companion to the chart-generated `pangolin-dashboard` IngressRoute
  # (websecure-only, see values.yaml's ingressRoute.dashboard comment) -
  # this one serves the same routes on plain HTTP (`web`), which is what
  # the Cilium Gateway actually forwards to this backend. No tls: block,
  # deliberately - a single IngressRoute mixing entryPoints with a tls:
  # block doesn't reliably serve the non-TLS entrypoint in Traefik v3.
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`pangolin.jvos.dev`) && PathPrefix(`/api/v1`)
      priority: 100
      services:
        - kind: Service
          name: pangolin
          namespace: pangolin
          port: 3000
    - kind: Rule
      match: Host(`pangolin.jvos.dev`)
      priority: 10
      services:
        - kind: Service
          name: pangolin
          namespace: pangolin
          port: 3002
