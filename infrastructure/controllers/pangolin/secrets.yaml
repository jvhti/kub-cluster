apiVersion: v1
kind: Secret
metadata:
  name: pangolin-server-secret
  namespace: pangolin
type: Opaque
# Real value created imperatively (never committed) — matches the
# infrastructure/controllers/authelia/secrets.yaml convention. Referenced by
# values.yaml's pangolin.secret.existingSecretName/existingSecretKey.
#
#   kubectl create secret generic pangolin-server-secret \
#     --namespace pangolin \
#     --from-literal=SERVER_SECRET="$(openssl rand -base64 48 | tr -d '\n')" \
#     --dry-run=client -o yaml | kubectl apply -f -
