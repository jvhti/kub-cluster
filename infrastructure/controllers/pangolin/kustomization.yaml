apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pangolin

resources:
  - namespace.yaml
  - secrets.yaml
  - ip-pool.yaml

helmCharts:
  # First OCI-sourced chart in this repo (every other chart uses a classic
  # Helm repo index URL) - verified to resolve via the ArgoCD
  # kustomize-build-with-helm plugin's kustomize v5.8.1 / Helm v3.19.4 before
  # committing.
  - name: pangolin
    repo: oci://ghcr.io/fosrl/helm-charts
    version: 0.1.0-alpha.1 # renovate: github-tags=fosrl/helm-charts (still alpha upstream)
    releaseName: pangolin
    namespace: pangolin
    valuesFile: values.yaml
    includeCRDs: true

commonAnnotations:
  argocd.argoproj.io/sync-wave: "5" # After cloudnative-pg (-10) and traefik (0)
