# Controller mode + multi topology (recommended production setup, per the
# chart's own examples/values-controller-cnpg.yaml + examples/values-gerbil-loadbalancer.yaml,
# combined here). Traefik is a SEPARATE release
# (infrastructure/controllers/traefik/), not the chart's bundled subchart -
# installTraefikController stays false (the chart default).
deployment:
  type: controller
  mode: multi

# Namespace is managed by this kustomization's own namespace.yaml (PSA label
# included there), not by the chart - matches every other controller in this
# repo (cert-manager, authelia, longhorn, ...).
namespace:
  create: false

# ---------------------------------------------------------------------------
# Database - CloudNativePG, operator installed separately
# (infrastructure/controllers/cloudnative-pg/); this release only creates the
# Cluster (via the bundled cnpg-cluster subchart).
# ---------------------------------------------------------------------------
database:
  mode: cloudnativepg
  cloudnativepg:
    cluster:
      name: pangolin-db

cnpg-operator:
  enabled: false # Installed cluster-wide as its own infra controller instead

cnpg-cluster:
  enabled: true
  fullnameOverride: pangolin-db
  type: postgresql
  mode: standalone
  cluster:
    instances: 1 # Pangolin is low-throughput; no HA replication needed (unlike gitea's postgresql-ha)
    storage:
      size: 5Gi
      storageClass: longhorn # Low-latency NVMe tier - same class gitea's own DB subchart uses, not the NFS bulk tier

# ---------------------------------------------------------------------------
# Pangolin application settings
# ---------------------------------------------------------------------------
pangolin:
  replicaCount: 1

  secret:
    existingSecretName: pangolin-server-secret # see secrets.yaml
    existingSecretKey: SERVER_SECRET

  config:
    app:
      dashboard_url: "https://pangolin.jvos.dev"
      log_level: info
    domains:
      domain1:
        # Deliberately a sub-zone of jvos.dev, not jvos.dev itself: Resources
        # created in Pangolin's dashboard get subdomains under base_domain
        # dynamically (myservice.p.jvos.dev, ...), generated by
        # pangolin-kube-controller directly as Traefik IngressRoutes - keeping
        # this scoped to p.jvos.dev means they can never collide with this
        # cluster's own app subdomains (gitea.jvos.dev, longhorn.jvos.dev, ...),
        # which all live directly under jvos.dev. The dashboard itself
        # (pangolin.jvos.dev, above) is unaffected - it's a fixed hostname, not
        # a dynamically-created Resource.
        #
        # *.p.jvos.dev needs its own wildcard DNS record and Certificate - see
        # infrastructure/controllers/traefik/certificate-resources.yaml. TLS for
        # Resources under this domain comes from Traefik's default TLSStore
        # (infrastructure/controllers/traefik/values.yaml), not cert_resolver -
        # the controller-generated IngressRoutes have no per-Resource place to
        # set a static secretName.
        base_domain: p.jvos.dev
        # Chart requires this non-empty (PANGOLIN-059) even though no
        # certificatesResolvers.letsencrypt is actually configured on this
        # Traefik - harmless: Resources rely on the default TLSStore cert
        # (infrastructure/controllers/traefik/values.yaml) as the real
        # fallback, same as the dashboard's own static-secretName approach.
        cert_resolver: letsencrypt
    gerbil:
      start_port: 51820 # Keep in sync with gerbil.ports.wg1 below
      clients_start_port: 21820 # Keep in sync with gerbil.ports.wg2 below
      base_endpoint: "vpn.jvos.dev"
    traefik:
      enabled: true
      http_entrypoint: web
      https_entrypoint: websecure
      cert_resolver: "" # Static cert-manager Secret instead of Traefik ACME - see ingressRoute.dashboard.tls below

  ingressRoute:
    dashboard:
      # Deliberately websecure-only here. The Cilium Gateway (see
      # infrastructure/controllers/traefik/httproute.yaml) forwards plain
      # HTTP, not HTTPS, to this backend - it terminates public TLS itself
      # and does not re-encrypt to a backend's HTTPS port. So this chart-
      # generated IngressRoute's `web` entrypoint would seem like the
      # answer, but a single IngressRoute with both `web`+`websecure` in
      # entryPoints PLUS a tls: block does not reliably serve the `web`
      # entrypoint in Traefik v3 (confirmed live: adding `web` here still
      # 404'd on port 80 while websecure kept working fine - a known
      # Traefik CRD-provider limitation, see
      # https://github.com/traefik/traefik/issues/5275). Fixed instead with
      # a second, separate, TLS-less IngressRoute for the `web` entrypoint -
      # see ingressroute-web.yaml in this directory.
      tls:
        enabled: true
        certResolver: "" # Mutually exclusive with secretName - static cert, not ACME
        secretName: pangolin-tls # cert-manager-issued Secret - see infrastructure/controllers/traefik/certificate.yaml

# ---------------------------------------------------------------------------
# Controller (pangolin-kube-controller) - reconciles IngressRoute/Middleware
# CRDs against the dedicated Traefik release in this same namespace.
# ---------------------------------------------------------------------------
controller:
  enabled: true
  replicaCount: 1

# ---------------------------------------------------------------------------
# Gerbil - WireGuard gateway, exposed via a dedicated LoadBalancer IP
# (see ip-pool.yaml) separate from the Cilium Gateway's HTTP(S) IP.
# ---------------------------------------------------------------------------
gerbil:
  enabled: true
  startupMode: delayed # First install only - flip to `normal` once Pangolin's setup wizard is complete
  persistence:
    enabled: true # WireGuard private key survives Pod restarts - required with a LoadBalancer so peers don't need to re-handshake
    size: 1Gi
  service:
    type: LoadBalancer
    loadBalancerIP: "192.168.1.241" # Pinned - see ip-pool.yaml
  ports:
    wg1: 51820
    wg2: 21820
    internalApi: 3004

networkPolicy:
  enabled: true
  controller:
    egress:
      enabled: true
      kubernetesApi:
        enabled: true
        # Required - without it, no egress rule is rendered for K8s API access
        # at all and the controller can't watch/list IngressRoute/Middleware/etc
        # CRDs, crash-looping forever on a dial timeout (confirmed live: this
        # was broken from the very first deploy, 16+ restarts before caught).
        # ClusterIP of the `kubernetes` Service in the default namespace -
        # confirm with `kubectl get svc kubernetes -n default` if this cluster's
        # Service CIDR ever changes.
        cidr: "10.43.0.1/32"
  pangolin:
    externalIngress:
      # Default false - the chart assumes its own bundled Traefik subchart
      # (same release/pod-network path) when this is left off. We run a
      # separate, standalone Traefik release (infrastructure/controllers/traefik/)
      # that reaches the dashboard UI (port 3002, "next") as a distinct pod, so
      # this must be explicitly opened or Traefik's connection to Pangolin
      # times out (confirmed live: 504 Gateway Timeout through Traefik's
      # IngressRoute until this was set).
      next: true
  gerbil:
    allowWireguardUdpEgress: true
    wireguardUdpCIDRs:
      - 0.0.0.0/0
