apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "longhorn.jvos.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Routes through oauth2-proxy (backed by Authelia) instead of
        # straight to longhorn-frontend — Longhorn's UI has no built-in
        # auth and was fully internet-exposed once this Gateway/DNS/DMZ
        # setup went live. See infrastructure/controllers/authelia/ and
        # infrastructure/controllers/oauth2-proxy/.
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
          weight: 1
