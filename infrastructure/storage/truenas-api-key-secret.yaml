apiVersion: v1
kind: Secret
metadata:
  name: truenas-api-key
  namespace: default
type: Opaque
# The actual secret data should be created using kubectl with the real value:
# kubectl create secret generic truenas-api-key \
#   --namespace default \
#   --from-literal=api-key='your-truenas-api-key-here' \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: this file is a reference copy only, documenting the expected shape —
# it is not wired into any kustomization.yaml resources: list, so ArgoCD
# never applies it. The real Secret is created directly on the cluster via
# kubectl (see repo CLAUDE.md: run kubectl over SSH on the node, not here).
