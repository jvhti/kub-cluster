apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # k3s's CoreDNS Corefile has `import /etc/coredns/custom/*.server` at the
  # top level (outside the main '.:53' server block) — this .server file
  # defines a separate, zone-scoped server block for jvos.dev.
  #
  # Why: pods resolving *.jvos.dev via public DNS get the public/WAN IP
  # (177.223.44.79), but connecting back to that IP from inside the cluster
  # times out (hairpin NAT isn't supported on the router) — confirmed via a
  # real oauth2-proxy pod hanging on OIDC discovery against
  # https://auth.jvos.dev. This split-horizon override makes in-cluster
  # clients resolve *.jvos.dev straight to the internal Gateway VIP
  # (192.168.1.240, same as infrastructure/networking/gateway/gateway.yaml's
  # pinned address) instead, skipping the round-trip through the public IP
  # entirely. External clients are unaffected — they never talk to this
  # cluster's CoreDNS.
  #
  # A separate server block (not a `hosts` addition to the main '.:53'
  # block via *.override) is required here because CoreDNS's `hosts` plugin
  # can only be used once per server block, and the main block already has
  # one (for /etc/coredns/NodeHosts).
  jvos.dev.server: |
    jvos.dev:53 {
        hosts {
            192.168.1.240 jvos.dev
            192.168.1.240 auth.jvos.dev
            192.168.1.240 argocd.jvos.dev
            192.168.1.240 longhorn.jvos.dev
            # NOT gateway-headscale's VIP (192.168.1.241) directly, despite
            # every other entry here pointing straight at a Gateway VIP.
            # headscale's server_url uses :8443 (what EXTERNAL clients need
            # through the router's port-forward), but the Gateway itself
            # only ever listens on 443 - the `hosts` plugin can only rewrite
            # the IP, not the port, so an in-cluster client resolving
            # straight to .241 would still try (and hang) on .241:8443,
            # which nothing listens on (confirmed live: Headplane's API-key
            # validation and a plain curl both hung indefinitely this way).
            # This is the ClusterIP of headscale-external-port (infra/
            # controllers/headscale/service-external-port.yaml), a Service+
            # EndpointSlice pair that remaps :8443 -> gateway-headscale's
            # real :443 at the kube-proxy/Cilium layer - no proxy pod
            # involved. ClusterIPs are stable for a Service's lifetime but
            # not literally pinned the way LAN VIPs are; if that Service is
            # ever deleted/recreated, update this to match its new
            # ClusterIP (`kubectl get svc headscale-external-port -n
            # headscale`).
            10.43.44.194 headscale.jvos.dev
            fallthrough
        }
        forward . /etc/resolv.conf
    }
