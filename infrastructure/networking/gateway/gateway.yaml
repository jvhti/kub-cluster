apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-internal
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "7" # After the wildcard Certificate is issued
    # external-dns only reads the target annotation from the Gateway itself
    # (not from HTTPRoutes) when using the gateway-httproute source, so this
    # is the one place to override the DNS target away from the Gateway's
    # internal address (10.2.0.1) to the public/WAN IP. Static IP per user
    # confirmation — update this value if the ISP-assigned IP ever changes.
    #
    # Kept as a plain value rather than sourced from a Secret/ConfigMap: we
    # tried gitignoring the value out of the repo, but ArgoCD's repo-server
    # clones fresh from git to build manifests and never sees local
    # untracked files on kube-client, so that approach can't work here. And
    # since this IP is published in public jvos.dev DNS A records the
    # moment external-dns syncs (that's the entire point of this
    # annotation), hiding it from the repo wouldn't have kept it private
    # anyway — anyone can already `dig` it.
    external-dns.alpha.kubernetes.io/target: "177.223.44.79"
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.240 # Pinned so the router port-forward/DMZ target doesn't need to change if the Service is recreated. Must be inside gateway-lan-pool's range (ip-pool.yaml in this dir) — deliberately on the LAN subnet (192.168.1.0/24) rather than main-pool's 10.2.0.0/16, since L2 announcement/ARP for an off-subnet VIP never reaches the router.
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      # No `hostname` here (matches every other *.jvos.dev app on this
      # listener) - the headscale-tls-passthrough listener below is scoped
      # to headscale.jvos.dev specifically, so the two don't overlap despite
      # sharing port 443.
      tls:
        mode: Terminate
        certificateRefs:
          - name: jvos-dev-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: headscale-tls-passthrough
      port: 443
      protocol: TLS
      hostname: "headscale.jvos.dev"
      # Passthrough (not Terminate): Headscale must see and terminate the
      # raw TLS connection itself using its own cert (infrastructure/
      # controllers/headscale/certificate.yaml), because Cilium's Gateway
      # API implementation hardcodes Envoy's HTTP upgradeConfigs to allow
      # only the standard "websocket" type - Tailscale client registration
      # needs a custom "tailscale-control-protocol" Upgrade header instead,
      # which gets rejected with a bare 403 under HTTPS/Terminate mode
      # (confirmed live, reproducibly - see infrastructure/controllers/
      # headscale/tlsroute.yaml). TLS passthrough is pure SNI-based TCP
      # routing, so Envoy never inspects/proxies the HTTP layer at all.
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute
