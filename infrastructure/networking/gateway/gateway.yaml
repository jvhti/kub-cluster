apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-internal
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "7" # After the wildcard Certificate is issued
    # external-dns only reads the target annotation from the Gateway itself
    # (not from HTTPRoutes) when using the gateway-httproute source, so this
    # is the one place to override the DNS target away from the Gateway's
    # internal address (10.2.0.1) to the public/WAN IP. Static IP per user
    # confirmation — update this value if the ISP-assigned IP ever changes.
    #
    # Kept as a plain value rather than sourced from a Secret/ConfigMap: we
    # tried gitignoring the value out of the repo, but ArgoCD's repo-server
    # clones fresh from git to build manifests and never sees local
    # untracked files on kube-client, so that approach can't work here. And
    # since this IP is published in public jvos.dev DNS A records the
    # moment external-dns syncs (that's the entire point of this
    # annotation), hiding it from the repo wouldn't have kept it private
    # anyway — anyone can already `dig` it.
    external-dns.alpha.kubernetes.io/target: "177.223.44.79"
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.240 # Pinned so the router port-forward/DMZ target doesn't need to change if the Service is recreated. Must be inside gateway-lan-pool's range (ip-pool.yaml in this dir) — deliberately on the LAN subnet (192.168.1.0/24) rather than main-pool's 10.2.0.0/16, since an off-subnet VIP is unreachable by the router. L2-announce is disabled; .240 is a static secondary IP on kub-ctrl-1's ens18 (see CLAUDE.md "Node-local state").
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: jvos-dev-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
# Headscale's TLSRoute passthrough listener deliberately does NOT live here -
# see infrastructure/controllers/headscale/gateway.yaml for why (a genuine
# Cilium v1.19.1 bug: adding a TLSRoute-serving listener alongside these
# HTTPRoute-serving ones made the operator silently generate an empty/broken
# CiliumEnvoyConfig for the HTTPRoute side - no errors logged, just wrong
# output, confirmed live and survived both operator and full cilium
# daemonset restarts. Took down every *.jvos.dev app simultaneously).
