apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-lan-pool
spec:
  # main-pool (10.2.0.0/16, see infrastructure/networking/cilium/ip-pool.yaml)
  # is not on the same broadcast domain as the LAN (192.168.1.0/24), so L2
  # announcement/ARP for it never reaches the router — nothing outside the
  # cluster nodes themselves can resolve or route to it. gateway-internal
  # needs a VIP actually inside 192.168.1.0/24 so the router's DMZ/port
  # forward can reach it. Scoped via serviceSelector to only this Gateway's
  # generated Service, so it doesn't affect anything else drawing from
  # main-pool.
  blocks:
    - start: "192.168.1.240"
      stop: "192.168.1.250" # Free range outside observed LAN/DHCP activity (.1, .10, .16 seen in use) — verify against your router's DHCP pool if it's ever widened.
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": "gateway"
      "io.kubernetes.service.name": "cilium-gateway-gateway-internal"
