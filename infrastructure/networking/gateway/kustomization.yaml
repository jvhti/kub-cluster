apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - gateway-class.yaml
  - certificate.yaml
  - gateway.yaml

# Reads the public IP from a git-ignored local file (see .gitignore and
# public-ip.env.example) so the plaintext value never enters git history.
# Copy public-ip.env.example to public-ip.env with the real IP before
# applying.
#
# ConfigMap rather than Secret: this Kustomize version's secretGenerator only
# emits base64-encoded `data`, which the `replacements` transformer below
# can't decode, so a Secret source would inject broken base64 into the
# annotation. A ConfigMap stores the value in plaintext natively, which
# `replacements` can copy directly — and since this IP ends up published in
# public jvos.dev DNS A records the moment external-dns syncs (that's the
# entire point of the record), a Secret's at-rest encryption wouldn't have
# hidden it from anyone anyway. This still achieves the actual goal: keeping
# the IP out of git.
configMapGenerator:
  - name: public-ip-config
    namespace: gateway
    envs:
      - public-ip.env

# Copies the ConfigMap's PUBLIC_IP value into the Gateway's target
# annotation at build time, replacing the REPLACED_BY_KUSTOMIZE placeholder
# in gateway.yaml.
replacements:
  - source:
      kind: ConfigMap
      name: public-ip-config
      fieldPath: data.PUBLIC_IP
    targets:
      - select:
          kind: Gateway
          name: gateway-internal
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]
