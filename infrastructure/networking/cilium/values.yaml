cluster:
  name: nuc
  id: 1
kubeProxyReplacement: true
k8sServiceHost: 10.1.0.2
k8sServicePort: 6443
securityContext:
  capabilities:
    ciliumAgent: [ CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID ]
    cleanCiliumState: [ NET_ADMIN, SYS_ADMIN, SYS_RESOURCE ]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# https://docs.cilium.io/en/stable/network/concepts/ipam/
ipam:
  mode: kubernetes
operator:
  rollOutPods: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
# Roll out cilium agent pods automatically when ConfigMap is updated.
rollOutCiliumPods: true
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
debug:
  enabled: true
# Increase rate limit when doing L2 announcements
k8sClientRateLimit:
  qps: 100
  burst: 200
l2announcements:
  enabled: true
# By default, NetworkPolicy ipBlock rules do NOT match intra-cluster IPs
# (pod/node IPs, including Service ClusterIPs like the kube-apiserver's) under
# Cilium - confirmed live: Pangolin's controller egress rule
# (cidr: 10.43.0.1/32, the `kubernetes` Service ClusterIP in infrastructure/
# controllers/pangolin/values.yaml) rendered correctly but never actually
# allowed the traffic, crash-looping the controller. `nodes` mode is the
# smaller-blast-radius option (vs `pods`) and covers this case since the API
# server runs on a control-plane node's IP. Cilium's own docs discourage this
# at scale (extra security identities per CIDR-matched pod/node), but that
# concern doesn't apply on this 3-node homelab cluster.
policyCIDRMatchMode: nodes
externalIPs:
  enabled: true
loadBalancer:
  # https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#maglev-consistent-hashing
  algorithm: maglev
gatewayAPI:
  enabled: true
  # Enable Application-Layer Protocol Negotiation (ALPN) which will attempt HTTP/2, then HTTP 1.1.
  # Services that wish to use HTTP/2 must indicate that via their appProtocol (GEP-1911).
  enableAlpn: false
envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [ NET_ADMIN, PERFMON, BPF ]
hubble:
  enabled: true
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true
ingressController:
  enabled: false
  default: true
  loadbalancerMode: shared
  service:
    annotations:
      io.cilium/lb-ipam-ips: 10.2.0.1
# mTLS
authentication:
  enabled: false
  mutual:
    spire:
      enabled: false
      install:
        server:
          dataStorage:
            storageClass: cilium-spire-sc
