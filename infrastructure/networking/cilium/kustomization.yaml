apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ip-pool.yaml
  # hubble.jvos.dev — the Hubble UI (hubble-ui Service in this same namespace)
  # behind the Authelia-gated oauth2-proxy-hubble. external-dns auto-creates
  # the public Cloudflare record from this route's hostname.
  - http-route-hubble.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.19.1 # renovate: github-releases=cilium/cilium
    releaseName: "cilium"
    includeCRDs: true
    namespace: kube-system
    valuesFile: values.yaml
