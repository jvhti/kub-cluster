apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: main-l2-policy
  namespace: kube-system
spec:
  interfaces:
    - eth.*
    - enp.*
    - ens.*
    - wlan.*
    - wlp.*
  loadBalancerIPs: true
  externalIPs: true
  # overkill excluded: its physical NIC (enp4s0) drops packets under its
  # normal Longhorn/VXLAN load (confirmed live via /proc/net/dev RX drop
  # counter climbing, plus cilium_bpf_ratelimit_dropped_total actively
  # incrementing) once it also takes on L2-announcement leadership for the
  # Gateway VIP — every *.jvos.dev app went unreachable externally whenever
  # the announcement lease landed on this node specifically (2026-08-24/25
  # incident).
  #
  # kub-node-1 excluded: its only interface matching `interfaces` above is
  # ens18, but that interface is on 10.1.0.0/8 — it has NO address on the
  # 192.168.1.0/24 segment where the Gateway (.240) / headscale (.241) VIPs
  # live. `interfaces` matches by name pattern, not by subnet, so it can't
  # tell kub-node-1's ens18 (10.1.0.10) apart from kub-ctrl-1's ens18
  # (192.168.1.15). When the announcement lease lands on kub-node-1 it
  # "announces" on the wrong L2 segment, so no LAN host / in-cluster pod can
  # ARP-resolve the VIP — confirmed live 2026-09-02: after a rolling agent
  # restart re-elected both leases onto kub-node-1, pod->.240 and .241 hung
  # (ARP entries stuck FAILED on the other nodes) while the same VIPs worked
  # whenever kub-ctrl-1 / pi1 held the lease. The eligible set is now
  # kub-ctrl-1 + pi1 (both have a 192.168.1.x address).
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: NotIn
        values:
          - overkill
          - kub-node-1
