provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

sources:
  - gateway-httproute

domainFilters:
  - jvos.dev

txtOwnerId: kub-cluster

policy: sync

# Cloudflare proxy (orange cloud) is off by default — --cloudflare-proxied is a
# presence-only flag that turns it ON, so omitting it (rather than passing
# =false, which external-dns doesn't accept) keeps records as plain DNS-only,
# which is what we want while pointing at a LAN IP via router port-forward.
