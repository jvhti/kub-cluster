#---------------------------------------------------------------------
# DMZ-facing L4 forwarder for the kub-cluster homelab.
#
# This box is the router's DMZ target (replacing the previous direct
# DMZ -> 192.168.1.240 setup) because the home router only supports a
# single DMZ host, not per-port forwarding. This HAProxy instance fans
# inbound traffic on 192.168.1.239 back out to whatever internal
# destination each port actually belongs to - the Cilium Gateway VIP
# for HTTP(S) (SNI-routed to either gateway-internal or
# gateway-headscale), and a k3s NodePort for WireGuard (via nftables,
# not HAProxy - see the note near the bottom).
#
# Managed via the HAProxy Data Plane API (dataplaneapi.yml) rather than
# hand-edited after initial bring-up - see that file for API config.
#---------------------------------------------------------------------

global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon

    # Runtime admin socket - required for the Data Plane API to inspect
    # and modify live state without a full reload for supported changes.
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    retries 3
    timeout connect 5s
    timeout client  1m
    timeout server  1m

#---------------------------------------------------------------------
# HTTP(S) -> Cilium Gateway VIPs
# Pure TCP passthrough - neither Gateway VIP's TLS is touched here.
#
# :443 is SNI-routed (TLS ClientHello inspection, no decryption) between
# gateway-internal (everything) and gateway-headscale (headscale.jvos.dev
# specifically) so both Gateways can share one external port. Verified
# live this HAProxy build supports req.ssl_sni in mode tcp (haproxy -vv:
# "SSL library supports SNI: yes"; syntax validated with `haproxy -c`
# against a scratch config before applying here).
#
# This replaces the old :8443 external-port workaround entirely - see
# infrastructure/controllers/headscale/ in the repo for what else changed
# alongside this (configmap.yaml server_url, headplane config,
# tailscale-router login-server, and removal of the
# headscale-external-port Service+EndpointSlice that used to remap
# :8443->:443 for in-cluster clients only).
#---------------------------------------------------------------------
frontend fe_http
    bind *:80
    mode tcp
    option tcplog
    default_backend be_gateway_http

backend be_gateway_http
    mode tcp
    server gateway-internal 192.168.1.240:80 check

frontend fe_https
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_gateway_headscale if { req.ssl_sni -i headscale.jvos.dev }
    default_backend be_gateway_https

backend be_gateway_https
    mode tcp
    server gateway-internal 192.168.1.240:443 check

backend be_gateway_headscale
    mode tcp
    server gateway-headscale 192.168.1.241:443 check

# NOTE: WireGuard (UDP 51820) is deliberately NOT configured here.
# HAProxy has no general raw-UDP relay capability (confirmed: this build
# has -QUIC, and even QUIC support would only cover HTTP/3, not arbitrary
# UDP protocols like WireGuard). UDP forwarding for this box is handled
# by nftables DNAT instead - see nftables.nft in this same directory
# (live at /etc/nftables.nft on this box) - which runs alongside HAProxy.
