loki:
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: "filesystem"
  schemaConfig:
    configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 2
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 7d

# Chart default allocatedMemory (8192MB) sizes the chunks-cache memcached's
# own -m flag to 8Gi, with resources.limits auto-derived as 1.2x that
# (9830Mi) - sized for real production log volume. Nothing ships logs into
# this cluster's Loki yet (no Promtail/Alloy/Vector/Fluent Bit deployed) -
# Loki currently has zero series ingested - so shrink drastically until that
# changes. Setting allocatedMemory (not just resources) matters: it's what
# tells memcached itself how much to try to use, so the process and its
# cgroup limit stay in agreement.
chunksCache:
  allocatedMemory: 256

# SingleBinary mode - simplest deployment for filesystem storage
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi

# Disable components not needed in SingleBinary mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# No S3 or MinIO needed - using local filesystem
minio:
  enabled: false

# No gateway needed in SingleBinary mode
gateway:
  enabled: false

# Disable self-monitoring to reduce resource usage
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# Disable test pod
test:
  enabled: false
