apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: kube-prometheus-stack
spec:
  parentRefs:
  - name: gateway-internal
    namespace: gateway
    sectionName: https
  hostnames:
  - "alertmanager.jvos.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    # Routes through the Alertmanager-dedicated oauth2-proxy instance instead
    # of straight to the alertmanager Service, so public access is
    # Authelia-gated. Only traffic via this public hostname is gated —
    # in-cluster consumers reach Alertmanager over the Service DNS name and
    # bypass the gateway and the proxy entirely. Needs the ReferenceGrant in
    # infrastructure/controllers/oauth2-proxy-alertmanager/ (cross-namespace
    # backendRef).
    - name: oauth2-proxy-alertmanager
      namespace: oauth2-proxy-alertmanager
      port: 80
      weight: 1
