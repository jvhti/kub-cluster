# grafana-admin-api-token (kube-prometheus-stack ns) — REFERENCE ONLY, not
# applied by ArgoCD (deliberately not listed in kustomization.yaml).
#
# An admin-level Grafana service-account token for the "Kub-Cluster" service
# account. Used for one-off Grafana API calls that are NOT part of GitOps —
# importing/updating dashboards, provisioning datasources, org/user admin.
# The token value itself is NEVER committed; this file is the durable record
# of the creation command + how to use it (same convention as
# applications/memos/secrets.yaml's gitea-admin-pat, homarr's
# homarr-admin-api-key, etc.).
#
# Create / rotate (imperatively, cluster-only):
#
#   kubectl create secret generic grafana-admin-api-token \
#     -n kube-prometheus-stack \
#     --from-literal=token='<the admin-level service-account token>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# To read it:
#   kubectl get secret grafana-admin-api-token -n kube-prometheus-stack \
#     -o jsonpath='{.data.token}' | base64 -d
#
# To regenerate: Grafana UI → Administration → Service accounts → the
# "Kub-Cluster" account → regenerate its token with the Admin role, then
# re-run the create command above.
#
# Use it (from a pod — the node can't reach the ClusterIP directly):
#   TOK=$(kubectl get secret grafana-admin-api-token -n kube-prometheus-stack -o jsonpath='{.data.token}' | base64 -d)
#   kubectl run -n kube-prometheus-stack gfapi --restart=Never --image=curlimages/curl --rm -it -- \
#     curl -sS -H "Authorization: Bearer $TOK" "http://prometheus-grafana/api/search?type=dash-db"
#
# NOTE: dashboards themselves are managed GitOps-style as
# grafana_dashboard-labelled ConfigMaps in dashboards/ (auto-provisioned by
# the kube-prometheus-stack sidecar) — this token is for the ad-hoc admin
# stuff that doesn't fit that model, not for committing dashboard JSON.
