apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-prometheus-stack

resources:
  - namespace.yaml
  - http-route-grafana.yaml
  - http-route-prometheus.yaml
  - http-route-alertmanager.yaml
  - custom-alerts.yaml
  - custom-servicemonitors.yaml
  - longhorn-alerts.yaml
  - network-policy.yaml
  - dashboards/k3s-cluster-overview-configmap.yaml
  - dashboards/dashboard-16450-configmap.yaml
  # alertmanager-config.yaml is a standalone Secret (full apiVersion/kind),
  # not a patch onto a pre-existing resource — the Helm chart doesn't
  # render a Secret under this exact name, so it belongs under `resources`
  # (create) rather than `patchesStrategicMerge` (merge into an existing
  # Id), which was failing the build with
  # "failed to find unique target for patch".
  - alertmanager-config.yaml

helmCharts:
  - name: kube-prometheus-stack
    releaseName: prometheus
    repo: https://prometheus-community.github.io/helm-charts
    version: 82.4.1
    namespace: kube-prometheus-stack
    valuesFile: values.yaml
    includeCRDs: true

commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
  argocd.argoproj.io/sync-options: "RespectIgnoreDifferences=true"
